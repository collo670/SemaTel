<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>

<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SemaTel"/>
<meta name="theme-color" content="#2e7d32"/>
<meta name="description" content="AI-powered telecom assistant for buying airtime, data, sending money, and more"/>
<meta name="mobile-web-app-capable" content="yes"/>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232e7d32' width='192' height='192'/><text x='96' y='120' font-size='100' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>ST</text></svg>"/>

<title>SemaTel – AI Chatbot</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g9:#1b5e20;--g8:#2e7d32;--g7:#388e3c;--g6:#43a047;
  --g5:#4caf50;--g4:#66bb6a;--g3:#a5d6a7;--g1:#e8f5e9;--g0:#f1f8e9;
  --y7:#f9a825;--y5:#fdd835;--y4:#ffee58;--y1:#fffde7;
  --r6:#d32f2f;--r1:#ffebee;
  --wa-hdr:#1f6f3f;--wa-chat:#e7efe4;--wa-in:#ffffff;--wa-out:#d9fdd3;--wa-out-txt:#111b21;
  --wa-bar:#f0f2f0;--wa-chip:#ffffff;
  --bg:var(--wa-chat);--surf:var(--wa-in);--txt:#111b21;--mut:#667781;--bdr:rgba(0,0,0,.08);
  --fd:'Josefin Sans',sans-serif;--fb:'DM Sans',sans-serif;
  --sh:0 8px 32px rgba(0,0,0,.18);
  --app-max:480px;
  --hdr-h:56px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
html{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:var(--fb);background:var(--wa-chat);
  margin:0;padding:0;overflow:hidden;
  min-height:100%;min-height:100dvh;
  display:flex;justify-content:center;align-items:stretch;
  font-size:16px;transition:background .3s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{
  width:100%;max-width:var(--app-max);
  height:100%;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
  padding-left:var(--sal);padding-right:var(--sar);
}
@media (min-width:520px){
  body{padding:12px 0}
  .app{border-radius:4px;box-shadow:var(--sh);height:calc(100dvh - 24px);max-height:900px}
}
.hdr{
  flex:0 0 auto;
  min-height:var(--hdr-h);
  background:var(--wa-hdr);
  display:flex;align-items:center;gap:8px;
  color:#fff;
  padding:var(--sat) 8px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  z-index:20;
}
.hdr-back{
  width:44px;height:44px;min-width:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:50%;flex-shrink:0;
  transition:background .15s;
}
.hdr-back::before{
  content:'';width:10px;height:10px;
  border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  transform:rotate(45deg);margin-left:4px;
}
.hdr-back:active{background:rgba(255,255,255,.12)}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo-no-icon::before{
  content:'ST';width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:14px;font-weight:800;flex-shrink:0;
}
.logo-no-icon{display:flex;align-items:center;gap:10px}
.logo-no-icon::before{margin-right:0}
.logo>div{min-width:0}
.logo-name{font-family:var(--fd);font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-sub{font-family:var(--fd);font-weight:500;font-size:12.5px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.msgs{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:8px 10px 12px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(46,125,50,.06) 0,transparent 42%),
    radial-gradient(circle at 80% 70%,rgba(76,175,80,.05) 0,transparent 38%);
}
.date-lbl{text-align:center;font-size:11px;color:var(--mut);margin:6px 0 8px}
.date-lbl span{
  background:rgba(255,255,255,.92);color:var(--mut);
  border-radius:8px;padding:5px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  font-weight:500;
}
.mrow{display:flex;align-items:flex-end;gap:6px;margin-bottom:2px;animation:fu .25s ease-out both;max-width:100%}
.mrow.user{flex-direction:row-reverse}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mav{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--g8),var(--g5));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:10px;font-weight:800;color:#fff;flex-shrink:0;
  margin-bottom:2px;
}
.mrow.user .mav{display:none}
.bub{
  max-width:min(82%,calc(100vw - 80px));
  padding:7px 10px 5px;
  font-size:15px;line-height:1.42;
  border-radius:8px;
  word-wrap:break-word;overflow-wrap:anywhere;
  box-shadow:0 1px 1px rgba(0,0,0,.06);
}
.bub.bot{
  background:var(--wa-in);color:var(--txt);
  border-radius:0 8px 8px 8px;border:1px solid var(--bdr);
}
.bub.user{
  background:var(--wa-out);color:var(--wa-out-txt);
  border-radius:8px 0 8px 8px;border:none;
}
.bub .t{font-size:10.5px;opacity:.55;display:block;margin-top:3px;text-align:right;line-height:1}
.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;width:100%}
.qa-tile{
  background:var(--g0);border:1px solid var(--bdr);border-radius:12px;
  padding:10px 6px;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--g9);
  text-align:center;transition:background .1s;
  -webkit-user-select:none;user-select:none;
}
.qa-tile:active{background:var(--g1)}
.qa-icon{font-size:20px;line-height:1}
.rcard{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:12px;margin-top:6px;max-width:100%}
.rcard-title{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--g8);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.rcard-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--bdr)}
.rcard-row:last-child{border-bottom:none}
.rcard-row :last-child{font-weight:600;text-align:right;flex-shrink:0}
.btn-block{
  width:100%;padding:11px;border-radius:10px;border:none;
  background:var(--g8);color:#fff;font-weight:600;font-size:13px;
  margin-top:8px;cursor:pointer;min-height:44px;
}
.btn-block:active{opacity:.88}
.btn-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn-sub{
  flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);
  padding:10px;border-radius:10px;border:1px solid var(--bdr);
  background:var(--g0);color:var(--g9);font-weight:600;font-size:12px;
  cursor:pointer;min-height:44px;
}
.trow{display:none;align-items:flex-end;gap:6px;padding:4px 0}
.trow.show{display:flex}
.tbub{background:var(--wa-in);border:1px solid var(--bdr);border-radius:0 12px 12px 12px;padding:10px 14px;display:flex;gap:4px;align-items:center}
.td{width:7px;height:7px;border-radius:50%;background:var(--g4);animation:td 1s infinite alternate}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{from{transform:translateY(0);opacity:.3}to{transform:translateY(-4px);opacity:1}}
.chips-bar{
  flex:0 0 auto;
  padding:6px 8px;
  display:flex;flex-wrap:nowrap;gap:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--wa-bar);
  border-top:1px solid var(--bdr);
  scrollbar-width:none;
}
.chips-bar::-webkit-scrollbar{display:none}
.chips-bar:empty{display:none}
.chip{
  flex:0 0 auto;
  padding:8px 14px;border-radius:18px;
  font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--bdr);
  background:var(--wa-chip);color:var(--g8);
  white-space:nowrap;min-height:36px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.chip:active{background:var(--g0)}
.ibar{
  flex:0 0 auto;
  background:var(--wa-bar);
  padding:6px 8px calc(6px + var(--sab));
  border-top:1px solid var(--bdr);
  z-index:20;
}
.irow{display:flex;align-items:flex-end;gap:6px}
.ibox{
  flex:1;min-width:0;
  background:#fff;border-radius:24px;
  border:1px solid var(--bdr);
  display:flex;align-items:flex-end;
  padding:5px 6px 5px 14px;gap:4px;
}
textarea{
  flex:1;border:none;outline:none;background:transparent;
  font-family:var(--fb);font-size:16px;color:var(--txt);
  resize:none;min-height:24px;max-height:120px;
  line-height:1.4;padding:6px 0;width:100%;
}
input,textarea,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.modal input{font-size:16px}
.send{
  width:44px;height:44px;min-width:44px;border-radius:50%;border:none;
  background:var(--g8);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:18px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(46,125,50,.25);
}
.send:active{transform:scale(.96)}
.mic-btn{
  width:36px;height:36px;min-width:36px;border-radius:50%;border:none;
  background:rgba(46,125,50,.12);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-bottom:2px;
}
.qa-tile,.btn-block,.btn-sub,.chip,.hdr-back,.send,.mic-btn,.pin-btn{touch-action:manipulation}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--g8);display:block}
.mic-btn.recording .rec-dot{background:#e53935;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}100%{transform:scale(1);opacity:1}}
.mic-btn.recording{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)}50%{box-shadow:0 0 0 6px rgba(229,57,53,.3)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}
.send.recording{background:#e53935;animation:pulse 1s infinite}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
  padding:max(12px,var(--sal)) max(12px,var(--sar)) max(12px,var(--sab));
}
.modal.show{display:flex}
@media (min-width:520px){.modal{align-items:center}}
.modal-content{
  background:var(--surf);border-radius:16px 16px 0 0;
  padding:20px;width:100%;max-width:var(--app-max);
  max-height:min(90dvh,560px);overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);border:1px solid var(--bdr);
  animation:fu .2s ease-out;
}
@media (min-width:520px){.modal-content{border-radius:16px;max-width:360px}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pin-btn{
  padding:14px;border-radius:12px;border:1px solid var(--bdr);
  background:var(--g0);color:var(--txt);font-weight:700;
  cursor:pointer;text-align:center;min-height:48px;font-size:18px;
}
.shimmer{background:linear-gradient(90deg,var(--g0) 25%,var(--g1) 50%,var(--g0) 75%);background-size:200% 100%;animation:loading 1.5s infinite}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (max-width:519px){
  :root{--hdr-h:70px}
  .hdr{
    padding:var(--sat) 10px 10px;
    gap:10px;
  }
  .logo-no-icon::before{width:44px;height:44px;font-size:15px}
  .logo-name{font-size:18px}
  .logo-sub{font-size:13px}
  .ibar{padding:10px 10px calc(10px + var(--sab))}
  .ibox{
    padding:8px 8px 8px 16px;
    border-radius:26px;
    min-height:50px;
    align-items:center;
  }
  textarea{min-height:34px;padding:8px 0;line-height:1.45}
  .send{width:48px;height:48px;min-width:48px;font-size:19px}
  .mic-btn{width:40px;height:40px;min-width:40px;margin-bottom:0}
}
@media (max-width:360px){
  .bub{font-size:14px;max-width:88%}
  .qa-grid{gap:6px}
  .qa-tile{font-size:11px;min-height:58px;padding:8px 4px}
  .logo-name{font-size:15px}
}
@media (max-width:320px){
  .btn-sub{flex:1 1 100%;min-width:100%}
  .chip{font-size:12px;padding:7px 12px}
}
@media (orientation:landscape) and (max-height:500px){
  .hdr{min-height:48px;padding-top:max(4px,var(--sat))}
  .logo-no-icon::before{width:32px;height:32px;font-size:12px}
  .msgs{padding:4px 8px}
  .ibar{padding-top:4px}
}
@supports (height:100dvh){
  .app{height:100dvh}
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/compromise@14.14.0/builds/compromise.min.js"></script>
<script>
// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
      reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(err => console.log('SW registration failed:', err));
  });
}

// Handle app install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show custom install button if needed
  console.log('App can be installed');
});

window.addEventListener('appinstalled', () => {
  console.log('PWA installed successfully');
  deferredPrompt = null;
});
</script>
</head>
<body>
  <div class="app" id="appShell">
    <header class="hdr">
      <div class="hdr-back" id="btnBack" role="button" aria-label="Back" tabindex="0"></div>
      <div class="logo logo-no-icon">
        <div><div class="logo-name">SemaTel</div><div class="logo-sub" id="lblSubtitle">SEMA•PATA•MALIZA</div></div>
      </div>
    </header>

    <div class="chat-wrap">
      <div class="msgs" id="chatBox" role="log" aria-live="polite">
        <div class="date-lbl"><span id="lblToday">Leo</span></div>
        <div class="trow" id="typingIndicator"><div class="mav">ST</div><div class="tbub"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>

    <div class="chips-bar" id="chipContainer" role="toolbar" aria-label="Quick replies"></div>

    <footer class="ibar">
      <div class="irow">

        </div>
        <button type="button" class="send" id="btnSend" aria-label="Send">➤</button>
      </div>
    </footer>
  </div>

  <!-- SECURITY DIALOG (OTP & PIN MODAL) -->
  <div class="modal" id="securityModal">
    <div class="modal-content" id="securityModalContent"></div>
  </div>

<script>
/* ==========================================
   1. CONVERSATION STATE MACHINE & DICTIONARY
   ========================================== */
const ConversationState = {
  HOME: 'HOME',
  CLARIFICATION: 'CLARIFICATION',
  AIRTIME_FLOW: 'AIRTIME_FLOW',
  DATA_FLOW: 'DATA_FLOW',
  MONEY_FLOW: 'MONEY_FLOW',
  MONEY_PROVIDER_SELECT: 'MONEY_PROVIDER_SELECT',
  MONEY_PHONE_COLLECT: 'MONEY_PHONE_COLLECT',

  VOUCHER_CODE_INPUT: 'VOUCHER_CODE_INPUT',
  ACCOUNT_FLOW: 'ACCOUNT_FLOW',

const CHIP_INTENT_MAP = {
  'Buy Airtime': 'BUY_AIRTIME',
  'Buy Data Bundle': 'BUY_DATA_BUNDLE',
  'Send Money': 'SEND_MONEY',
  'Check Balance': 'CHECK_BALANCE',
  'Redeem Voucher': 'REDEEM_VOUCHER',

  'Nunua Umeme': 'BUY_LUKU',
  'Buy LUKU': 'BUY_LUKU'
};

/* Swahili/English telecom vocabulary from maneno.docx — each phrase maps to one intent */
const MANENO_LEXICON = {
  BUY_AIRTIME: [
    'muda wa maongezi', 'kadi ya kuongeza salio', 'ongeza salio', 'nunua salio', 'jaza salio',
    'tuma salio', 'hamisha salio', 'niongezee', 'niongezee vocha', 'weka vocha', 'nipatie vocha',
    'tuma vocha', 'nitumie vocha', 'naomba vocha', 'niongezee muda', 'nipigie vocha',
    'nicheki vocha', 'nirushie vocha', 'nipandishie salio', 'nibusti salio',
    'niongezee bando la kupiga', 'buy airtime', 'add airtime', 'send airtime',
    'transfer airtime', 'voice package', 'recharge', 'credit', 'weka hela', 'kadi ya malipo',
    'jaza', 'ongeza', 'airtime', 'nunua airtime'
  ],
  BUY_MINUTE_BUNDLES: [
    'nipe dakika', 'dakika za kupiga', 'nifungulie dakika', 'dakika', 'miniti',
    'vifurushi vya dakika', 'kifurushi cha dakika', 'vifurushi vya simu', 'buy minutes',
    'nunua dakika'

const ManenoIntentIndex = (function() {
  const phraseList = [];
  Object.keys(MANENO_LEXICON).forEach(function(intent) {
    MANENO_LEXICON[intent].forEach(function(phrase) {
      const p = (phrase || '').toLowerCase().trim();
      if (p) phraseList.push({ intent: intent, phrase: p });
    });
  });
  phraseList.sort(function(a, b) { return b.phrase.length - a.phrase.length; });
  const escapeRe = function(s) {
    return s.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
  };
  return {
    match: function(text) {
      const n = (text || '').toLowerCase().trim();
      if (!n) return null;
      for (let i = 0; i < phraseList.length; i++) {
        const item = phraseList[i];
        const re = new RegExp('\\b' + escapeRe(item.phrase) + '\\b', 'i');
        if (re.test(n) || (item.phrase.indexOf(' ') >= 0 && n.indexOf(item.phrase) >= 0)) {
          return item;
        }
      }
      return null;
    },
    trainingData: function() {
      const out = [];
      Object.keys(MANENO_LEXICON).forEach(function(intent) {
        MANENO_LEXICON[intent].forEach(function(phrase) {
          out.push({ intent: intent, utterance: phrase });
        });
      });
      return out;
    },
    keywordsFor: function(intent) {
      return MANENO_LEXICON[intent] ? MANENO_LEXICON[intent].slice() : [];
    }
  };
})();

/* ==========================================
   3. NLP + ML INTENT RECOGNITION ENGINE
   ========================================== */
const MLIntentModel = {
  trained: false,
  intents: [],
  vocabulary: {},
  tokenCounts: {},
  priors: {},

  tokenize: function(text) {
    return (text || '').toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(Boolean);
  },

  normalizeText: function(text) {
    if (typeof window !== 'undefined' && window.nlp) {
      try {
        return window.nlp(text).normalize({ punctuation: true, whitespace: true, lowercase: true }).out('text');
      } catch (e) {
        return text.toLowerCase();
      }
    }
    return text.toLowerCase();
  },

  train: function(trainingData) {
    this.trained = false;
    this.intents = [];
    this.vocabulary = {};
    this.tokenCounts = {};
    this.priors = {};
    const dataset = trainingData || [];
    const intentCounts = {};

    dataset.forEach(item => {
      const intent = item.intent;
      intentCounts[intent] = (intentCounts[intent] || 0) + 1;
      this.tokenCounts[intent] = this.tokenCounts[intent] || {};
      const text = this.normalizeText(item.utterance);
      const tokens = this.tokenize(text);
      tokens.forEach(token => {
        this.vocabulary[token] = (this.vocabulary[token] || 0) + 1;
        this.tokenCounts[intent][token] = (this.tokenCounts[intent][token] || 0) + 1;
      });
    });

    this.intents = Array.from(new Set(dataset.map(item => item.intent)));

    const totalDocs = dataset.length;
    Object.keys(intentCounts).forEach(intent => {
      this.priors[intent] = Math.log((intentCounts[intent] + 1) / (totalDocs + Object.keys(intentCounts).length));
    });
    this.trained = true;
  },

  classify: function(text) {
    const intentFallback = {
      intent: 'UNKNOWN', confidence: 0.30, entities: {}
    };
    if (!this.trained || !text || !text.trim()) {
      return intentFallback;
    }

    const normalizedText = this.normalizeText(text);
    const tokens = this.tokenize(normalizedText);
    if (!tokens.length) {
      return intentFallback;
    }

    const scores = {};
    this.intents.forEach((intent, i) => {
      if (!(intent in scores)) scores[intent] = this.priors[intent] || Math.log(1 / (this.intents.length + 1));
      const totalTokenCount = Object.values(this.tokenCounts[intent]).reduce((sum, v) => sum + v, 0) + Object.keys(this.vocabulary).length;
      tokens.forEach(token => {
        const count = this.tokenCounts[intent][token] || 0;
        scores[intent] += Math.log((count + 1) / totalTokenCount);
      });
    });

    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    if (!sorted.length) {
      return intentFallback;
    }
    const bestIntent = sorted[0][0];
    const scoreValues = sorted.map(([_, score]) => Math.exp(score));
    const confidence = scoreValues[0] / scoreValues.reduce((a, b) => a + b, 0);

    const entities = {
      amount: null,
      recipient: null,
      recipientPhone: null,
      provider: null
    };

    const phoneMatch = text.match(/(\+?255\s?7\d{2}\s?\d{3}\s?\d{3}|\+?2557\d{8}|0\d{9}|07\d{8})/g);
    if (phoneMatch) {
      entities.recipientPhone = phoneMatch[0].replace(/\s+/g, '');
      entities.recipient = entities.recipientPhone;
    }

    const amountMatch = text.match(/(\d+[\d,\.]*)\s*(k|ksh|tsh|elfu)?/i);
    if (amountMatch) {
      let amt = parseInt(amountMatch[1].replace(/[,.]/g, ''));
      const suffix = (amountMatch[2] || '').toLowerCase();
      if (suffix === 'k' || suffix === 'elfu') {
        if (amt < 100) amt *= 1000;
      }
      entities.amount = amt;
    }

    if (window.nlp) {
      try {
        const doc = window.nlp(text);
        const people = doc.people().out('text');
        if (people) {
          entities.recipient = people;
        }
      } catch (e) {
        // ignore
      }
    }

    return {
      intent: bestIntent,
      confidence: Math.max(0.01, Math.min(0.99, confidence)),
      entities
    };
  }
};

const AIIntentEngine = {
  parse: function(text) {
    const normalized = (text || '').toLowerCase().trim();
    const mlResult = MLIntentModel.classify(text);
    const providerKeywords = {
      'm-pesa': 'M-Pesa', 'mpesa': 'M-Pesa', 'm pesa': 'M-Pesa', 'vodacom m-pesa': 'M-Pesa',

    };
    let provider = null;
    Object.keys(providerKeywords).forEach(key => {
      if (new RegExp('\\b' + key.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b', 'i').test(normalized)) {
        provider = providerKeywords[key];

    const manenoHit = ManenoIntentIndex.match(normalized);
    if (manenoHit) {
      return { intent: manenoHit.intent, confidence: 0.99, entities: mlResult.entities };
    }

    // Use ML model result if it is strong enough, otherwise fallback to keyword mapping
    if (mlResult.confidence >= 0.68 && mlResult.intent !== 'UNKNOWN') {
      return mlResult;
    }

    const Fallback = {
      intent: 'UNKNOWN', confidence: 0.30, entities: mlResult.entities
    };
    const containsAny = (arr) => arr.some(w => new RegExp('\\b' + w.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&') + '\\b', 'i').test(normalized));
    const AIRTIME_KEYS = ManenoIntentIndex.keywordsFor('BUY_AIRTIME');

    const ACCOUNT_KEYS = ManenoIntentIndex.keywordsFor('MY_ACCOUNT');
    const HELP_KEYS = ManenoIntentIndex.keywordsFor('GET_HELP');

    const extractor = (arr, intent, confidence) => {
      if (containsAny(arr)) {
        return { intent, confidence, entities: mlResult.entities };
      }
      return null;
    };

    return extractor(BALANCE_KEYS, 'CHECK_BALANCE', 0.97) ||
      extractor(MINUTE_KEYS, 'BUY_MINUTE_BUNDLES', 0.96) ||
      extractor(SMS_KEYS, 'BUY_SMS_PACKAGES', 0.96) ||
      extractor(AIRTIME_KEYS, 'BUY_AIRTIME', 0.96) ||
      extractor(DATA_KEYS, 'BUY_DATA_BUNDLE', 0.95) ||
      extractor(MONEY_KEYS, 'SEND_MONEY', 0.94) ||
      extractor(VOUCHER_KEYS, 'REDEEM_VOUCHER', 0.92) ||
      extractor(ACCOUNT_KEYS, 'MY_ACCOUNT', 0.93) ||
      extractor(HELP_KEYS, 'GET_HELP', 0.98) ||
      Fallback;
  }
};

      ChatbotMemory.walletBalance -= txData.amount;
    } else if (txData.type === 'VOUCHER') {
      if (txData.voucherType === 'DATA') {
        const match = String(ChatbotMemory.dataBalance).match(/([0-9]+(\.[0-9]+)?)/);
        const currentData = match ? parseFloat(match[1]) : 0;
        ChatbotMemory.dataBalance = `${(currentData + 1).toFixed(1)} GB`;
      } else {
        ChatbotMemory.airtimeBalance += txData.amount;
      }
    }
    ChatbotMemory.recentTransactions.unshift({
      type: txData.type,
      details: txData.details || `${txData.type} Transaction`,
      amt: cost,
      date: new Date().toISOString().split('T')[0]
    });
    StorageManager.save();
  },

  process(txData) {
    return new Promise((resolve, reject) => {
      const run = () => {
        setTimeout(() => {
          const cost = txData.amount || txData.price || 0;
          if (fromAirtimeBalance(txData) && ChatbotMemory.airtimeBalance < cost) {
            reject({ status: 'FAILED', reason: 'Insufficient airtime balance' });
            return;
          }
          if (needsWallet(txData) && ChatbotMemory.walletBalance < cost) {
            reject({ status: 'FAILED', reason: 'Insufficient funds' });
            return;
          }
          const isSuccess = Math.random() > 0.12;
          if (isSuccess) {
            TransactionEngine.applyBalanceChanges(txData);
            FraudGuard.record();
            resolve({
              status: 'SUCCESS',
              ref: 'ST' + Math.floor(10000000 + Math.random() * 89999999),
              date: new Date().toLocaleDateString(),
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
          } else {
            const failureReasons = [
              'Insufficient Funds',
              'Network Timeout Error',
              'Core Telecommunication API Offline',
              'Payment gateway declined card'
            ];
            reject({
              status: 'FAILED',
              reason: failureReasons[Math.floor(Math.random() * failureReasons.length)]
            });
          }
        }, 2000);
      };

      if (!navigator.onLine) {
        OfflineTxQueue.enqueue(txData);
        reject({ status: 'FAILED', reason: 'Offline – transaction queued for sync', queued: true });
        return;
      }
      run();
    });
  }
};

function fromAirtimeBalance(tx) {
  return /airtime balance/i.test(tx.paymentMethod || '');
}
function needsWallet(tx) {
  const pay = tx.paymentMethod || '';
  if (tx.type === 'MONEY') return true;
  if (tx.type === 'VOUCHER') return false;
  if (fromAirtimeBalance(tx)) return false;
  return /wallet|m-pesa|tigo|airtel|card/i.test(pay) || tx.type === 'DATA' || tx.type === 'SMS';
}

  initSpeechRecognition: function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      console.log('Speech Recognition not supported');
      document.getElementById('micBtn').style.display = 'none';
      return;
    }
    
    this.recognition = new SpeechRecognition();
    this.recognition.continuous = false;
    this.recognition.interimResults = false;
    this.recognition.lang = ChatbotMemory.lang === 'en' ? 'en-TZ' : 'sw-TZ';
    this.pendingVoiceSend = false;

    this.recognition.onstart = () => {
      this.isListening = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('userInput').placeholder = '🎙️ Listening...';
    };

    this.recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          transcript += event.results[i][0].transcript;
        }
      }
      if (transcript) {
        document.getElementById('userInput').value = transcript;
        this.pendingVoiceSend = true;
      }
    };
    
    this.recognition.onerror = (event) => {
      console.error('Speech recognition error', event.error);
      this.addMessage('🎙️ Sikio halijasomeka. Jaribu tena.', 'bot');
    };
    
    this.recognition.onend = () => {
      this.isListening = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('userInput').placeholder = 'Andika hapa / Type message...';
      if (this.pendingVoiceSend) {
        this.pendingVoiceSend = false;
        this.sendMessage();
      }
    };

/*
   * processUserInput(input)
   *
   * Accepts either a single string or an array of strings.
   *
   * • Single string  → processes one message and returns its response descriptor
   *   (same behaviour as before; all existing callers are unaffected).
   *
   * • Array of strings → iterates every element in order, processes each one
   *   through the same state-machine pipeline, and returns an array of response
   *   descriptors that mirrors the input order exactly.
   *
   * Response descriptor shape:
   *   {
   *     input     : string,          // the original input text
   *     intent    : string|null,     // resolved intent key, or null for system commands
   *     confidence: number|null,     // NLP confidence [0-1], or null for system commands
   *     state     : string,          // ConversationState at the time this item was processed
   *     handled   : boolean          // true when a recognised handler ran
   *   }
   */
  processUserInput: function(input) {
    /* ── Batch branch ── */
    if (Array.isArray(input)) {
      return input.map(function(item) { return Engine._processSingle(item); });
    }

    /* ── Single-string branch (all existing callers unchanged) ── */
    this._processSingle(input);
  },

  /* _processSingle(text)
   *
   * The single source of truth for processing one user message.
   * Handles two orthogonal concerns:
   *
   * 1. INTENT ESCAPE — whenever the user types a recognisable intent keyword
   *    (confidence ≥ 0.80) while the bot is mid-flow, the current flow is
   *    abandoned and the new intent is routed immediately.  This is what lets
   *    the conversation keep moving regardless of which flow state is active.
   *    States that must never be interrupted (active OTP / PIN / confirm screens,
   *    ongoing processing) are explicitly excluded from the escape hatch.
   *
   * 2. FLOW-SPECIFIC TEXT INPUT — states that genuinely need typed text
   *    (phone numbers, amounts, voucher codes, etc.) receive it normally via
   *    their STATE_HANDLERS entry; the intent-escape check runs first and only
   *    fires when the text matches a different service, so legitimate in-flow
   *    text is never hijacked.
   */
  _processSingle: function(text) {
    const t = (text || '').trim();

    /* ── System-command shortcuts ── */
    if (t === this.translate('retry') || /^jaribu tena$/i.test(t) || t === '🔄 ' + this.translate('retry')) {
      this.retryTransaction();
      return { input: t, intent: 'SYSTEM_RETRY', confidence: null, state: this.currentState, handled: true };
    }
    if (t === this.translate('home') || /^mwanzo$/i.test(t) || /^home$/i.test(t)) {
      this.resetToHome();
      return { input: t, intent: 'SYSTEM_HOME', confidence: null, state: this.currentState, handled: true };
    }

    /* ── Snapshot the state before any handler mutates it ── */
    const stateAtEntry = this.currentState;

    /* ── States where we must NEVER interrupt mid-transaction ── */
    const lockedStates = [
      ConversationState.SECURITY_AUTH,
      ConversationState.PROCESSING,
      ConversationState.RESULT_SCREEN,
      ConversationState.MONEY_OTP_VERIFY,
      ConversationState.MONEY_PIN_COLLECT,
      ConversationState.LUKU_PIN_COLLECT,
      ConversationState.CONFIRM_TX
    ];

    /* ── States where the user is expected to type meaningful text (phone,
       amount, voucher code, etc.) — intent-escape should NOT fire here
       unless the input clearly has zero numeric / code content ── */
    const textInputStates = [
      ConversationState.MONEY_PHONE_COLLECT,
      ConversationState.MONEY_AMOUNT_COLLECT,
      ConversationState.VOUCHER_CODE_INPUT,
      'MONEY_CUSTOM_REC',
      'MONEY_PHONE_INPUT',
      'MONEY_CUSTOM_AMT',
      'AIRTIME_CUSTOM_AMT',
      ConversationState.LUKU_AMOUNT_COLLECT,
      ConversationState.LUKU_METER_COLLECT
    ];

    /* ── Intent-escape: try to parse a fresh intent from whatever the user typed.
       Fire if:
         • We are NOT in a locked or text-input state, AND
         • The recognised intent is different from the intent that owns the
           current flow, AND
         • Confidence is high enough (≥ 0.80).
       When it fires, reset currentTx and route the new intent so the
       conversation continues naturally instead of hitting a dead end. ── */
    const isLocked    = lockedStates.indexOf(stateAtEntry) !== -1;
    const isTextInput = textInputStates.indexOf(stateAtEntry) !== -1;
    const isHomelike  = stateAtEntry === ConversationState.HOME ||
                        stateAtEntry === ConversationState.CLARIFICATION ||
                        stateAtEntry === ConversationState.AWAIT_MORE_HELP ||
                        stateAtEntry === ConversationState.END_CHAT;

    if (!isLocked && !isTextInput && !isHomelike) {
      const evaluation = AIIntentEngine.parse(t);
      if (evaluation.confidence >= 0.80 && evaluation.intent !== 'UNKNOWN') {
        /* Wire any pre-detected entities so the new flow can use them */
        this.currentTx = { type: evaluation.intent };
        if (evaluation.entities.amount)        this.currentTx.amount        = evaluation.entities.amount;
        if (evaluation.entities.recipient)     this.currentTx.recipient     = evaluation.entities.recipient;
        if (evaluation.entities.recipientPhone) this.currentTx.recipient    = evaluation.entities.recipientPhone;
        if (evaluation.entities.provider)      this.currentTx.paymentMethod = evaluation.entities.provider;

        this.currentState = ConversationState.HOME;   /* allow routeIntent to set its own state */
        this.routeIntent(evaluation.intent);
        return { input: t, intent: evaluation.intent, confidence: evaluation.confidence, state: stateAtEntry, handled: true };
      }
    }

    /* ── Standard state-machine routing (unchanged from original) ── */
    if (stateAtEntry === ConversationState.END_CHAT) {
      this.handleEndChatInput(text);
      return { input: t, intent: null, confidence: null, state: stateAtEntry, handled: true };
    }

    if (stateAtEntry === ConversationState.HOME ||
        stateAtEntry === ConversationState.CLARIFICATION) {
      const evaluation = AIIntentEngine.parse(t);
      this.handleHomeState(text);
      return {
        input     : t,
        intent    : evaluation.intent,
        confidence: evaluation.confidence,
        state     : stateAtEntry,
        handled   : true
      };
    }

    if (stateAtEntry === ConversationState.AWAIT_MORE_HELP) {
      const evaluation = AIIntentEngine.parse(t);
      this.handleMoreHelpResponse(text);
      return {
        input     : t,
        intent    : evaluation.intent,
        confidence: evaluation.confidence,
        state     : stateAtEntry,
        handled   : true
      };
    }

    const handler = this.STATE_HANDLERS[stateAtEntry];
    if (handler) {
      const evaluation = AIIntentEngine.parse(t);
      handler(text);
      return {
        input     : t,
        intent    : evaluation.intent,
        confidence: evaluation.confidence,
        state     : stateAtEntry,
        handled   : true
      };
    }

    /* ── True passive states: should never reach here in normal use ── */
    this.handlePassiveFlowInput(text);
    return { input: t, intent: null, confidence: null, state: stateAtEntry, handled: false };
  },

  routeIntent: function(intent) {
    if (intent === 'BUY_AIRTIME' || intent === 'BUY_MINUTE_BUNDLES') {
      this.currentTx.type = 'AIRTIME';
    } else if (intent === 'BUY_SMS_PACKAGES') {
      this.currentTx.type = 'SMS';
    } else if (intent === 'BUY_DATA_BUNDLE') {
      this.currentTx.type = 'DATA';
    } else if (intent === 'SEND_MONEY') {
      this.currentTx.type = 'MONEY';
    } else if (intent === 'BUY_LUKU') {
      this.currentTx.type = 'LUKU';
    } else {
      this.currentTx.type = intent;
    }
    
    switch(intent) {
      case 'BUY_AIRTIME':
        this.currentState = ConversationState.AIRTIME_FLOW;
        this.showAirtimeOptions();
        break;
      case 'BUY_MINUTE_BUNDLES':
        this.currentState = ConversationState.MINUTE_FLOW;
        this.showMinuteBundles();
        break;
      case 'BUY_SMS_PACKAGES':
        this.currentState = ConversationState.SMS_FLOW;
        this.showSmsOptions();
        break;
      case 'BUY_DATA_BUNDLE':
        this.currentState = ConversationState.DATA_FLOW;
        this.showDataCategories();
        break;
      case 'SEND_MONEY':
        this.currentState = ConversationState.MONEY_FLOW;
        this.currentTx = { type: 'MONEY' };
        this.showMoneyProviderStep();
        break;
      case 'CHECK_BALANCE':
        this.currentState = ConversationState.BALANCE_FLOW;
        this.showBalanceOptions();
        break;
      case 'REDEEM_VOUCHER':
        this.currentState = ConversationState.VOUCHER_FLOW;
        this.showVoucherTypeSelection();
        break;
      case 'MY_ACCOUNT':
        this.currentState = ConversationState.ACCOUNT_FLOW;
        this.showAccountDashboard();
        break;
      case 'BUY_LUKU':
        this.currentState = ConversationState.LUKU_FLOW;
        this.currentTx = { type: 'LUKU' };
        this.showLukuProviderStep();
        break;
      case 'GET_HELP':
        this.showHelpCenter();
        break;
      default:
        this.resetToHome();
    }
  },

  pressMoneyPIN: function(digit) {
    if (this._moneyPIN.length >= 4) return;
    this._moneyPIN += digit;

    if (this._moneyPIN.length === 4) {
      setTimeout(() => this.submitMoneyPIN(), 250);
    }

  deleteMoneyPIN: function() {
    if (this._moneyPIN.length > 0) {
      this._moneyPIN = this._moneyPIN.slice(0, -1);
      this._updateMoneyPINDots();
    }

  _updateMoneyPINDots: function() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('moneyPINDot' + i);
      if (dot) {
        dot.style.background = i < this._moneyPIN.length ? 'var(--g8)' : 'transparent';
      }
    }
  },

  submitMoneyPIN: function() {
    if (this._moneyPIN.length < 4) {
      const errEl = document.getElementById('moneyPINError');
      if (errEl) errEl.textContent = ChatbotMemory.lang === 'sw'
        ? 'Tafadhali weka tarakimu 4.'
        : 'Please enter 4 digits.';
      return;
    }
    /* Disable the grid to prevent double submission */
    const grid = document.getElementById('moneyPINGrid');
    if (grid) grid.style.pointerEvents = 'none';

    /* Show masked confirmation as user bubble */
    this.addMessage('●●●●', 'user');

    /* Build transaction details and move to confirm */
    this.currentTx.details = `Tuma Tsh ${Number(this.currentTx.amount).toLocaleString()} → ${this.currentTx.recipientName || this.currentTx.recipient} via ${this.currentTx.paymentMethod}`;
    this.showMoneyConfirmStep();

    `;

  },

  /* ==========================================
     H. HIGHLY CONFIGURABLE SECURITY GATE (OTP/PIN)
     ========================================== */
  buildTxSummaryLines: function() {
    const tx = this.currentTx;
    const lines = [];
    if (tx.details) lines.push(['Huduma / Service', tx.details]);
    if (tx.recipient) lines.push(['Mpokeaji / Recipient', tx.recipient]);
    if (tx.amount) lines.push(['Kiasi / Amount', `Tsh ${Number(tx.amount).toLocaleString()}`]);
    if (tx.price) lines.push(['Kiasi / Amount', `Tsh ${Number(tx.price).toLocaleString()}`]);
    if (tx.paymentMethod) lines.push(['Malipo / Payment', tx.paymentMethod]);
    return lines;
  },

  showTransactionConfirm: function() {
    if (!FraudGuard.check(this.currentTx)) {
      this.addMessage(this.translate('fraud_block'), 'bot');
      return;
    }
    this.currentState = ConversationState.CONFIRM_TX;
    const rows = this.buildTxSummaryLines().map(([k, v]) =>
      `<div class="rcard-row"><span>${k}</span><span>${v}</span></div>`
    ).join('');
    const html = `
      <div class="rcard">
        <div class="rcard-title">${this.translate('confirm_title')}</div>
        <div style="font-size:12px;margin-bottom:8px;">${this.translate('confirm_summary')}</div>
        ${rows}
        <button class="btn-block" style="margin-top:10px;" onclick="Engine.confirmTransaction()">${this.translate('confirm')}</button>
        <button class="btn-sub" style="width:100%;margin-top:6px;" onclick="Engine.cancelTransaction()">${this.translate('cancel')}</button>
      </div>`;
    this.addMessage(null, 'bot', html);
  },

  confirmTransaction: function() {
    const secType = this.currentTx.type === 'VOUCHER' ? 'VOUCHER' : (this.currentTx.type || 'TX');
    this.triggerSecurityGate(secType);
  },

  cancelTransaction: function() {
    this.addMessage(ChatbotMemory.lang === 'sw' ? 'Muamala umeghairiwa.' : 'Transaction cancelled.', 'bot');
    this.resetToHome();
  },

  triggerSecurityGate: function(type) {
    this.currentState = ConversationState.SECURITY_AUTH;
    const modal = document.getElementById('securityModal');
    const content = document.getElementById('securityModalContent');

    // Generating cryptographic random security code
    const generatedOTP = Math.floor(100000 + Math.random() * 899999);
    
    content.innerHTML = `
      <div style="text-align:center;">
        <div>${this.translate('otp_msg')}</div>
        <div style="font-size:24px; font-weight:800; background:var(--g0); padding:10px; margin:12px 0; border-radius:12px; letter-spacing:4px; color:var(--g9);">${generatedOTP}</div>
        <input type="number" id="otpVal" class="btn-block" style="background:var(--bg);color:var(--txt);text-align:center;font-size:18px;" placeholder="******">
        <button class="btn-block" onclick="Engine.verifyOTPCode(${generatedOTP})">${this.translate('confirm')}</button>
        <button class="btn-sub" style="width:100%;margin-top:6px;" onclick="Engine.closeSecurityDialog()">${this.translate('cancel') || 'Cancel'}</button>
      </div>
    `;
    modal.classList.add('show');
  },

  verifyOTPCode: function(correctOTP) {
    const entered = document.getElementById('otpVal').value.trim();
    if (entered == correctOTP) {
      // Elevate security verification clear into secure PIN request mapping
      this.promptWalletSecurePIN();
    } else {
      alert("Verification Code is Incorrect! Please authorize properly.");
    }
  },

  promptWalletSecurePIN: function() {
    const content = document.getElementById('securityModalContent');
    content.innerHTML = `
      <div style="text-align:center;">
        <div>${this.translate('pin_msg')}</div>
        <div style="font-size:24px; font-weight:800; margin:8px 0; letter-spacing:6px;" id="pinStars">****</div>
        <input type="password" id="pinVal" maxlength="4" readonly style="display:none;">
        <div class="pin-grid">
          <div class="pin-btn" onclick="Engine.pressPIN(1)">1</div>
          <div class="pin-btn" onclick="Engine.pressPIN(2)">2</div>
          <div class="pin-btn" onclick="Engine.pressPIN(3)">3</div>
          <div class="pin-btn" onclick="Engine.pressPIN(4)">4</div>
          <div class="pin-btn" onclick="Engine.pressPIN(5)">5</div>
          <div class="pin-btn" onclick="Engine.pressPIN(6)">6</div>
          <div class="pin-btn" onclick="Engine.pressPIN(7)">7</div>
          <div class="pin-btn" onclick="Engine.pressPIN(8)">8</div>
          <div class="pin-btn" onclick="Engine.pressPIN(9)">9</div>
          <div class="pin-btn" style="background:var(--r1);color:var(--r6);" onclick="Engine.closeSecurityDialog()">X</div>
          <div class="pin-btn" onclick="Engine.pressPIN(0)">0</div>
          <div class="pin-btn" style="background:var(--g1);color:var(--g8);" onclick="Engine.submitSecurePIN()">✓</div>
        </div>
      </div>
    `;
    this.enteredPIN = "";
  },

  pressPIN: function(num) {
    if (this.enteredPIN.length < 4) {
      this.enteredPIN += num;
      document.getElementById('pinStars').textContent = "●".repeat(this.enteredPIN.length) + "*".repeat(4 - this.enteredPIN.length);
    }
  },

  submitSecurePIN: function() {
    if (this.enteredPIN.length === 4) {
      this.closeSecurityDialog();
      this.executeCentralizedEngine();
    }
  },

  closeSecurityDialog: function() {
    document.getElementById('securityModal').classList.remove('show');
    if (this.currentState === ConversationState.SECURITY_AUTH) {
      this.currentState = ConversationState.CONFIRM_TX;
      this.addMessage(
        ChatbotMemory.lang === 'sw' ? 'Uthibitisho umeghairiwa.' : 'Verification cancelled.',
        'bot'
      );
    }
  },

  /* ==========================================
     I. ENGINE ACTION HANDLING & SCREEN GENERATION
     ========================================== */
   processTransaction: function() {
     this.currentState = ConversationState.PROCESSING;
     const shimID = 'shim-' + Date.now();
     const shimHTML = `
       <div class="rcard" id="${shimID}">
         <div class="rcard-title">⚙️ ${this.translate('processing')}</div>
         <div class="shimmer" style="height:12px; margin-top:8px; border-radius:6px; width:100%;"></div>
         <div class="shimmer" style="height:12px; margin-top:4px; border-radius:6px; width:75%;"></div>
       </div>`;
     this.addMessage(null, 'bot', shimHTML);

     TransactionEngine.process(this.currentTx)
       .then((res) => this.renderTransactionResult(shimID, res, null))
       .catch((error) => this.renderTransactionResult(shimID, null, error));
   },

   renderTransactionResult: function(shimID, res, error) {
     const container = document.getElementById(shimID);
     if (container && container.parentElement && container.parentElement.parentElement) {
       container.parentElement.parentElement.remove();
     }
     this.currentState = ConversationState.RESULT_SCREEN;
     if (res && res.status === 'SUCCESS') {
       const successHTML = `
         <div class="rcard" style="border-left: 4px solid var(--g5);">
           <div style="color:var(--g8);font-weight:700;font-size:14px;margin-bottom:6px;">${this.translate('success')}</div>
           <div class="rcard-row"><span>Ref Number:</span><span>${res.ref}</span></div>
           <div class="rcard-row"><span>Date/Time:</span><span>${res.date} | ${res.time}</span></div>
           <div class="rcard-row"><span>Transaction:</span><span>${this.currentTx.details}</span></div>
         </div>`;
       this.addMessage(null, 'bot', successHTML);
     } else {
       const reason = (error && error.reason) || (res && res.reason) || 'System Error';
       const queued = error && error.queued;
       const failedHTML = `
         <div class="rcard" style="border-left: 4px solid var(--r6); background: var(--r1);">
           <div style="color:var(--r6);font-weight:700;font-size:14px;margin-bottom:4px;">${this.translate('failed')}</div>
           <div style="font-size:12px;color:var(--txt);">Sababu: ${reason}</div>
           ${queued ? '<div style="font-size:11px;margin-top:4px;">Itasawazishwa ukiwa mtandaoni.</div>' : ''}
           <button class="btn-block" style="background:var(--r6);margin-top:8px;" onclick="Engine.retryTransaction()">🔄 ${this.translate('retry')}</button>
         </div>`;
       this.addMessage(null, 'bot', failedHTML);
     }
     this.askMoreHelp();
   },

   executeCentralizedEngine: function() {
     this.processTransaction();
   },

  retryTransaction: function() {
    this.showTransactionConfirm();
  },

  askMoreHelp: function() {
    setTimeout(() => {
      this.addMessage(this.translate('more_help'), 'bot');
      this.currentState = ConversationState.AWAIT_MORE_HELP;
      this.setChips(ChatbotMemory.lang === 'sw' ? ['NDIYO', 'HAPANA, ASANTE'] : ['YES', 'NO, THANK YOU']);
    }, 800);
  }
};

/* Mobile layout: viewport height + keyboard (WhatsApp-style shell) */
const LayoutManager = {
  app: null,
  chatBox: null,
  init() {
    this.app = document.getElementById('appShell');
    this.chatBox = document.getElementById('chatBox');
    this.updateViewport();
    window.addEventListener('resize', () => this.updateViewport());
    window.addEventListener('orientationchange', () => {
      setTimeout(() => this.updateViewport(), 150);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => this.updateViewport());
      window.visualViewport.addEventListener('scroll', () => this.updateViewport());
    }
    const input = document.getElementById('userInput');
    if (input) this.autoResizeTextarea(input);
  },
  updateViewport() {
    if (!this.app) return;
    const vv = window.visualViewport;
    const mobileLayout = window.matchMedia('(max-width: 520px), (pointer: coarse)').matches;
    if (vv && mobileLayout) {
      this.app.style.height = Math.round(vv.height) + 'px';
      this.app.style.marginTop = Math.round(vv.offsetTop) + 'px';
    } else {
      this.app.style.height = '';
      this.app.style.marginTop = '';
    }
    this.scrollChatToEnd();
  },
  autoResizeTextarea(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    this.scrollChatToEnd();
  },
  scrollChatToEnd() {
    if (!this.chatBox) return;
    requestAnimationFrame(() => {
      this.chatBox.scrollTop = this.chatBox.scrollHeight;
    });
  }
};

// Expose globals for dynamic in-chat buttons (onclick in bot HTML)
window.Engine = Engine;
window.LayoutManager = LayoutManager;

function bootSemaTel() {
  if (bootSemaTel.done) return;
  bootSemaTel.done = true;
  try {
    Engine.init();
  } catch (err) {
    console.error('SemaTel init failed:', err);
    const box = document.getElementById('chatBox');
    if (box) {
      box.insertAdjacentHTML('beforeend',
        '<div class="mrow"><div class="bub bot">Hitilafu katika kuanzisha programu. Pakia upya ukurasa (Ctrl+Shift+R).</div></div>');
    }
  }
}
bootSemaTel.done = false;

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootSemaTel);
} else {
  bootSemaTel();
}
</script>
