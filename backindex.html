<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g9:#1b5e20;--g8:#2e7d32;--g7:#388e3c;--g6:#43a047;
  --g5:#4caf50;--g4:#66bb6a;--g3:#a5d6a7;--g1:#e8f5e9;--g0:#f1f8e9;
  --y7:#f9a825;--y5:#fdd835;--y4:#ffee58;--y1:#fffde7;
  --r6:#d32f2f;--r1:#ffebee;
  --wa-hdr:#1f6f3f;--wa-chat:#e7efe4;--wa-in:#ffffff;--wa-out:#d9fdd3;--wa-out-txt:#111b21;
  --wa-bar:#f0f2f0;--wa-chip:#ffffff;
  --bg:var(--wa-chat);--surf:var(--wa-in);--txt:#111b21;--mut:#667781;--bdr:rgba(0,0,0,.08);
  --fd:'Josefin Sans',sans-serif;--fb:'DM Sans',sans-serif;
  --sh:0 8px 32px rgba(0,0,0,.18);
  --app-max:480px;
  --hdr-h:56px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
html{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:var(--fb);background:var(--wa-chat);
  margin:0;padding:0;overflow:hidden;
  min-height:100%;min-height:100dvh;
  display:flex;justify-content:center;align-items:stretch;
  font-size:16px;transition:background .3s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{
  width:100%;max-width:var(--app-max);
  height:100%;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg);
  position:relative;overflow:hidden;
  padding-left:var(--sal);padding-right:var(--sar);
}
@media (min-width:520px){
  body{padding:12px 0}
  .app{border-radius:4px;box-shadow:var(--sh);height:calc(100dvh - 24px);max-height:900px}
}
.hdr{
  flex:0 0 auto;
  min-height:var(--hdr-h);
  background:var(--wa-hdr);
  display:flex;align-items:center;gap:8px;
  color:#fff;
  padding:var(--sat) 8px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  z-index:20;
}
.hdr-back{
  width:44px;height:44px;min-width:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:50%;flex-shrink:0;
  transition:background .15s;
}
.hdr-back::before{
  content:'';width:10px;height:10px;
  border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  transform:rotate(45deg);margin-left:4px;
}
.hdr-back:active{background:rgba(255,255,255,.12)}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo-no-icon::before{
  content:'ST';width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:14px;font-weight:800;flex-shrink:0;
}
.logo-no-icon{display:flex;align-items:center;gap:10px}
.logo-no-icon::before{margin-right:0}
.logo>div{min-width:0}
.logo-name{font-family:var(--fd);font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-sub{font-family:var(--fd);font-weight:500;font-size:12.5px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.msgs{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:8px 10px 12px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(46,125,50,.06) 0,transparent 42%),
    radial-gradient(circle at 80% 70%,rgba(76,175,80,.05) 0,transparent 38%);
}
.date-lbl{text-align:center;font-size:11px;color:var(--mut);margin:6px 0 8px}
.date-lbl span{
  background:rgba(255,255,255,.92);color:var(--mut);
  border-radius:8px;padding:5px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  font-weight:500;
}
.mrow{display:flex;align-items:flex-end;gap:6px;margin-bottom:2px;animation:fu .25s ease-out both;max-width:100%}
.mrow.user{flex-direction:row-reverse}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mav{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--g8),var(--g5));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:10px;font-weight:800;color:#fff;flex-shrink:0;
  margin-bottom:2px;
}
.mrow.user .mav{display:none}
.bub{
  max-width:min(82%,calc(100vw - 80px));
  padding:7px 10px 5px;
  font-size:15px;line-height:1.42;
  border-radius:8px;
  word-wrap:break-word;overflow-wrap:anywhere;
  box-shadow:0 1px 1px rgba(0,0,0,.06);
}
.bub.bot{
  background:var(--wa-in);color:var(--txt);
  border-radius:0 8px 8px 8px;border:1px solid var(--bdr);
}
.bub.user{
  background:var(--wa-out);color:var(--wa-out-txt);
  border-radius:8px 0 8px 8px;border:none;
}
.bub .t{font-size:10.5px;opacity:.55;display:block;margin-top:3px;text-align:right;line-height:1}
.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;width:100%}
.qa-tile{
  background:var(--g0);border:1px solid var(--bdr);border-radius:12px;
  padding:10px 6px;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--g9);
  text-align:center;transition:background .1s;
  -webkit-user-select:none;user-select:none;
}
.qa-tile:active{background:var(--g1)}
.qa-icon{font-size:20px;line-height:1}
.rcard{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:12px;margin-top:6px;max-width:100%}
.rcard-title{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--g8);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.rcard-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--bdr)}
.rcard-row:last-child{border-bottom:none}
.rcard-row :last-child{font-weight:600;text-align:right;flex-shrink:0}
.btn-block{
  width:100%;padding:11px;border-radius:10px;border:none;
  background:var(--g8);color:#fff;font-weight:600;font-size:13px;
  margin-top:8px;cursor:pointer;min-height:44px;
}
.btn-block:active{opacity:.88}
.btn-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn-sub{
  flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);
  padding:10px;border-radius:10px;border:1px solid var(--bdr);
  background:var(--g0);color:var(--g9);font-weight:600;font-size:12px;
  cursor:pointer;min-height:44px;
}
.trow{display:none;align-items:flex-end;gap:6px;padding:4px 0}
.trow.show{display:flex}
.tbub{background:var(--wa-in);border:1px solid var(--bdr);border-radius:0 12px 12px 12px;padding:10px 14px;display:flex;gap:4px;align-items:center}
.td{width:7px;height:7px;border-radius:50%;background:var(--g4);animation:td 1s infinite alternate}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{from{transform:translateY(0);opacity:.3}to{transform:translateY(-4px);opacity:1}}
.chips-bar{
  flex:0 0 auto;
  padding:6px 8px;
  display:flex;flex-wrap:nowrap;gap:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--wa-bar);
  border-top:1px solid var(--bdr);
  scrollbar-width:none;
}
.chips-bar::-webkit-scrollbar{display:none}
.chips-bar:empty{display:none}
.chip{
  flex:0 0 auto;
  padding:8px 14px;border-radius:18px;
  font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--bdr);
  background:var(--wa-chip);color:var(--g8);
  white-space:nowrap;min-height:36px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.chip:active{background:var(--g0)}
.ibar{
  flex:0 0 auto;
  background:var(--wa-bar);
  padding:6px 8px calc(6px + var(--sab));
  border-top:1px solid var(--bdr);
  z-index:20;
}
.irow{display:flex;align-items:flex-end;gap:6px}
.ibox{
  flex:1;min-width:0;
  background:#fff;border-radius:24px;
  border:1px solid var(--bdr);
  display:flex;align-items:flex-end;
  padding:5px 6px 5px 14px;gap:4px;
}
textarea{
  flex:1;border:none;outline:none;background:transparent;
  font-family:var(--fb);font-size:16px;color:var(--txt);
  resize:none;min-height:24px;max-height:120px;
  line-height:1.4;padding:6px 0;width:100%;
}
input,textarea,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.modal input{font-size:16px}
.send{
  width:44px;height:44px;min-width:44px;border-radius:50%;border:none;
  background:var(--g8);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:18px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(46,125,50,.25);
}
.send:active{transform:scale(.96)}
.mic-btn{
  width:36px;height:36px;min-width:36px;border-radius:50%;border:none;
  background:rgba(46,125,50,.12);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-bottom:2px;
}
.qa-tile,.btn-block,.btn-sub,.chip,.hdr-back,.send,.mic-btn,.pin-btn{touch-action:manipulation}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--g8);display:block}
.mic-btn.recording .rec-dot{background:#e53935;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}100%{transform:scale(1);opacity:1}}
.mic-btn.recording{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.7)}50%{box-shadow:0 0 0 6px rgba(229,57,53,.3)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}
.send.recording{background:#e53935;animation:pulse 1s infinite}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
  padding:max(12px,var(--sal)) max(12px,var(--sar)) max(12px,var(--sab));
}
.modal.show{display:flex}
@media (min-width:520px){.modal{align-items:center}}
.modal-content{
  background:var(--surf);border-radius:16px 16px 0 0;
  padding:20px;width:100%;max-width:var(--app-max);
  max-height:min(90dvh,560px);overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);border:1px solid var(--bdr);
  animation:fu .2s ease-out;
}
@media (min-width:520px){.modal-content{border-radius:16px;max-width:360px}}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pin-btn{
  padding:14px;border-radius:12px;border:1px solid var(--bdr);
  background:var(--g0);color:var(--txt);font-weight:700;
  cursor:pointer;text-align:center;min-height:48px;font-size:18px;
}
.shimmer{background:linear-gradient(90deg,var(--g0) 25%,var(--g1) 50%,var(--g0) 75%);background-size:200% 100%;animation:loading 1.5s infinite}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Inline PIN dots used in conversational PIN entry */
.pin-dots{display:flex;justify-content:center;gap:16px;margin:12px 0;padding:10px;background:var(--g0);border-radius:10px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--g8);background:transparent;display:inline-block;transition:background .15s;}
.pin-dot.filled{background:var(--g8);}
@media (max-width:519px){
  :root{--hdr-h:70px}
  .hdr{padding:var(--sat) 10px 10px;gap:10px;}
  .logo-no-icon::before{width:44px;height:44px;font-size:15px}
  .logo-name{font-size:18px}
  .logo-sub{font-size:13px}
  .ibar{padding:10px 10px calc(10px + var(--sab))}
  .ibox{padding:8px 8px 8px 16px;border-radius:26px;min-height:50px;align-items:center;}
  textarea{min-height:34px;padding:8px 0;line-height:1.45}
  .send{width:48px;height:48px;min-width:48px;font-size:19px}
  .mic-btn{width:40px;height:40px;min-width:40px;margin-bottom:0}
}
@media (max-width:360px){
  .bub{font-size:14px;max-width:88%}
  .qa-grid{gap:6px}
  .qa-tile{font-size:11px;min-height:58px;padding:8px 4px}
  .logo-name{font-size:15px}
}
@media (max-width:320px){
  .btn-sub{flex:1 1 100%;min-width:100%}
  .chip{font-size:12px;padding:7px 12px}
}
@media (orientation:landscape) and (max-height:500px){
  .hdr{min-height:48px;padding-top:max(4px,var(--sat))}
  .logo-no-icon::before{width:32px;height:32px;font-size:12px}
  .msgs{padding:4px 8px}
  .ibar{padding-top:4px}
}
@supports (height:100dvh){
  .app{height:100dvh}
}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/compromise@14.14.0/builds/compromise.min.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
      reg.update();
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(err => console.log('SW registration failed:', err));
  });
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; });
</script>

  <div class="app" id="appShell">
    <header class="hdr">
      <div class="hdr-back" id="btnBack" role="button" aria-label="Back" tabindex="0"></div>
      <div class="logo logo-no-icon">
        <div><div class="logo-name">SemaTel</div><div class="logo-sub" id="lblSubtitle">SEMA•PATA•MALIZA</div></div>

        <button type="button" class="send" id="btnSend" aria-label="Send">➤</button>
      </div>
    </footer>
  </div>

  <div class="modal" id="securityModal">
    <div class="modal-content" id="securityModalContent"></div>
  </div>

<script>
/* ============================================================
   SEMA TEL — CONVERSATIONAL TRANSACTION ENGINE v2
   Design principle: "One message → One intent → One PIN → One result."
   Changes from v1:
   • Slot-filling replaces step-by-step state machine
   • Universal processIntent() for all service flows
   • Swahili street-language amount normalizer
   • Auto network detection from MSISDN prefix
   • Auto balance check before every transaction
   • Reduced confirmation steps — PIN goes straight to result
   ============================================================ */

/* ==========================================
   1. CONSTANTS & DICTIONARIES
   ========================================== */

/* Swahili street-language amount normalizer (docx spec) */
const STREET_AMOUNTS = {
  'jero': 500, 'mia tano': 500, 'nusu elfu': 500,
  'buku': 1000, 'elfu': 1000, 'kibuyu': 1000,
  'mbili buku': 2000, 'elfu mbili': 2000,
  'tatu buku': 3000, 'elfu tatu': 3000,
  'nne buku': 4000, 'elfu nne': 4000,
  'tano': 5000, 'elfu tano': 5000, 'buku tano': 5000,
  'sita buku': 6000, 'elfu sita': 6000,
  'saba buku': 7000, 'elfu saba': 7000,
  'nane buku': 8000, 'elfu nane': 8000,
  'tisa buku': 9000, 'elfu tisa': 9000,
  'kumi': 10000, 'elfu kumi': 10000, 'buku kumi': 10000,
  'ishirini': 20000, 'thelathini': 30000, 'arobaini': 40000,
  'hamsini': 50000, 'mia': 100, 'mia moja': 100
};

/* Street-language product shortcuts */
const STREET_PRODUCTS = {
  'sms za jero': { intent: 'BUY_SMS', amount: 500 },
  'sms za buku': { intent: 'BUY_SMS', amount: 1000 },
  'sms za tano': { intent: 'BUY_SMS', amount: 5000 },
  'dakika za jero': { intent: 'BUY_MINUTES', amount: 500 },
  'dakika za buku': { intent: 'BUY_MINUTES', amount: 1000 },
  'net ya buku': { intent: 'BUY_DATA', amount: 1000 },
  'net ya jero': { intent: 'BUY_DATA', amount: 500 },
  'nusu gb': { intent: 'BUY_DATA', product: '500MB' },
  'gb moja': { intent: 'BUY_DATA', product: '1GB' },
  'gb mbili': { intent: 'BUY_DATA', product: '2GB' },
  'gb tatu': { intent: 'BUY_DATA', product: '3GB' },
  'gb tano': { intent: 'BUY_DATA', product: '5GB' }
};

/* Tanzania MSISDN prefix → network map (docx spec) */
const NETWORK_PREFIXES = {
  '0611': 'Vodacom', '0612': 'Vodacom', '0613': 'Vodacom', '0614': 'Vodacom', '0615': 'Vodacom',
  '0616': 'Vodacom', '0617': 'Vodacom', '0618': 'Vodacom', '0619': 'Vodacom',
  '0741': 'Vodacom', '0742': 'Vodacom', '0743': 'Vodacom', '0744': 'Vodacom', '0745': 'Vodacom',
  '0746': 'Vodacom', '0747': 'Vodacom', '0748': 'Vodacom', '0749': 'Vodacom',
  '0710': 'Vodacom', '0711': 'Vodacom', '0712': 'Vodacom', '0713': 'Vodacom', '0714': 'Vodacom',
  '0715': 'Vodacom', '0716': 'Vodacom', '0717': 'Vodacom', '0718': 'Vodacom', '0719': 'Vodacom',
  '0620': 'Airtel', '0621': 'Airtel', '0622': 'Airtel', '0623': 'Airtel', '0624': 'Airtel',
  '0780': 'Airtel', '0781': 'Airtel', '0782': 'Airtel', '0783': 'Airtel', '0784': 'Airtel',
  '0785': 'Airtel', '0786': 'Airtel', '0787': 'Airtel', '0788': 'Airtel', '0789': 'Airtel',
  '0680': 'Tigo', '0681': 'Tigo', '0682': 'Tigo', '0683': 'Tigo', '0684': 'Tigo',
  '0671': 'Tigo', '0672': 'Tigo', '0673': 'Tigo', '0674': 'Tigo', '0675': 'Tigo',

/* ==========================================
   3. NETWORK AUTO-DETECTION (docx spec)
   ========================================== */
function detectNetwork(msisdn) {
  if (!msisdn) return null;
  const digits = msisdn.replace(/\D/g, '');
  // normalise 255712... → 0712...
  const local = digits.startsWith('255') ? '0' + digits.slice(3) : digits;
  const prefix4 = local.slice(0, 4);
  const prefix3 = local.slice(0, 3);
  return NETWORK_PREFIXES[prefix4] || NETWORK_PREFIXES[prefix3] || null;
}

function networkWallet(network) {
  return NETWORK_WALLET[network] || network || 'M-Pesa';
}

/* ==========================================
   4. AMOUNT & ENTITY NORMALIZER (docx spec)
   ========================================== */
function normalizeAmount(text) {
  const t = (text || '').toLowerCase().trim();
  // Check street-language map (longest-match first)
  const keys = Object.keys(STREET_AMOUNTS).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (t.includes(k)) return STREET_AMOUNTS[k];
  }
  // Numeric extraction with k/elfu suffixes
  const m = t.match(/(\d[\d,.]*)\s*(k|ksh|tsh|elfu)?/i);
  if (m) {
    let amt = parseInt(m[1].replace(/[,.]/g, ''));
    const sfx = (m[2] || '').toLowerCase();
    if ((sfx === 'k' || sfx === 'elfu') && amt < 100) amt *= 1000;
    return amt;
  }
  return null;
}

function extractMeter(text) {
  const m = (text || '').replace(/\D/g, '');
  if (m.length >= 11 && m.length <= 13) return m;
  return null;
}

function extractPhone(text) {
  const m = text.match(/(\+?255\s?7\d{2}\s?\d{3}\s?\d{3}|\+?2557\d{8}|0\d{9}|07\d{8})/g);
  return m ? m[0].replace(/\s+/g, '') : null;
}

/* ==========================================
   5. NLP INTENT ENGINE
   ========================================== */
const ManenoIntentIndex = (function() {
  const phraseList = [];
  Object.keys(MANENO_LEXICON).forEach(intent => {
    MANENO_LEXICON[intent].forEach(phrase => {
      const p = (phrase || '').toLowerCase().trim();
      if (p) phraseList.push({ intent, phrase: p });
    });
  });
  phraseList.sort((a, b) => b.phrase.length - a.phrase.length);
  const esc = s => s.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
  return {
    match(text) {
      const n = (text || '').toLowerCase().trim();
      if (!n) return null;
      for (const item of phraseList) {
        const re = new RegExp('\\b' + esc(item.phrase) + '\\b', 'i');
        if (re.test(n) || (item.phrase.includes(' ') && n.includes(item.phrase))) return item;
      }
      return null;
    }
  };
})();

/* Parse user text → { intent, amount, phone, meter, product, provider } */
function parseIntent(text) {
  const t = (text || '').toLowerCase().trim();
  const result = { intent: null, confidence: 0, amount: null, phone: null, meter: null, product: null, provider: null };

  // Street-language product shortcuts (highest priority)
  const streetKeys = Object.keys(STREET_PRODUCTS).sort((a, b) => b.length - a.length);
  for (const k of streetKeys) {
    if (t.includes(k)) {
      const sp = STREET_PRODUCTS[k];
      result.intent = sp.intent;
      result.confidence = 0.99;
      if (sp.amount) result.amount = sp.amount;
      if (sp.product) result.product = sp.product;
      break;
    }
  }

  // Maneno lexicon
  if (!result.intent) {
    const hit = ManenoIntentIndex.match(t);
    if (hit) { result.intent = hit.intent; result.confidence = 0.98; }
  }

  // Provider keywords
  const providerMap = {
    'm-pesa':'M-Pesa','mpesa':'M-Pesa','m pesa':'M-Pesa','vodacom':'Vodacom',
    'tigo pesa':'Tigo Pesa','tigo':'Tigo','airtel money':'Airtel Money',
    'airtel':'Airtel','halopesa':'HaloPesa','halo pesa':'HaloPesa',
    'selcompay':'SelcomPay','selcom':'SelcomPay','azampesa':'AzamPesa','azam':'AzamPesa'
  };
  Object.keys(providerMap).sort((a, b) => b.length - a.length).forEach(k => {
    if (new RegExp('\\b' + k.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\b', 'i').test(t)) {
      result.provider = providerMap[k];
    }
  });

  // GB/MB product size extraction
  const gbMatch = t.match(/(\d+(?:\.\d+)?)\s*gb/i);
  const mbMatch = t.match(/(\d+(?:\.\d+)?)\s*mb/i);
  if (gbMatch) { result.product = gbMatch[1] + 'GB'; if (!result.intent) { result.intent = 'BUY_DATA'; result.confidence = 0.97; } }
  if (mbMatch) { result.product = mbMatch[1] + 'MB'; if (!result.intent) { result.intent = 'BUY_DATA'; result.confidence = 0.97; } }

  // Extract entities
  result.amount = normalizeAmount(t);
  result.phone = extractPhone(text);
  result.meter = extractMeter(text.replace(/\s/g, ' ').split(' ').find(w => /^\d{11,13}$/.test(w)) || '');

  // Meter extraction — look for 11–13 consecutive digits not part of phone
  const meterRe = /\b(\d{11,13})\b/g;
  let mm;
  while ((mm = meterRe.exec(text)) !== null) {
    const candidate = mm[1];
    if (candidate !== (result.phone || '').replace(/\D/g, '')) {
      result.meter = candidate;
      if (!result.intent) { result.intent = 'BUY_LUKU'; result.confidence = 0.95; }
    }
  }

  return result;
}

   ========================================== */
function checkBalance(type) {
  // type: 'airtime' | 'wallet' | 'data'
  if (type === 'airtime') return ChatbotMemory.airtimeBalance;
  if (type === 'wallet') return ChatbotMemory.walletBalance;
  return ChatbotMemory.dataBalance;
}

function balanceSufficient(cost, source) {
  if (!source) source = 'wallet';
  const bal = (source === 'airtime') ? ChatbotMemory.airtimeBalance : ChatbotMemory.walletBalance;
  return bal >= cost;
}

const TransactionEngine = {
  applyBalanceChanges(txData) {
    const cost = txData.amount || txData.price || 0;
    const type = (txData.type || '').toUpperCase();
    if (type === 'AIRTIME') { ChatbotMemory.walletBalance -= cost; ChatbotMemory.airtimeBalance += cost; }
    else if (type === 'DATA') { ChatbotMemory.walletBalance -= cost; }
    else if (type === 'MONEY') { ChatbotMemory.walletBalance -= cost; }
    else if (type === 'SMS') { ChatbotMemory.walletBalance -= cost; }
    else if (type === 'MINUTES') { ChatbotMemory.walletBalance -= cost; }
    else if (type === 'LUKU') { ChatbotMemory.walletBalance -= cost; }
    else if (type === 'VOUCHER') {
      if (txData.voucherType === 'DATA') {
        const cur = parseFloat(String(ChatbotMemory.dataBalance)) || 0;
        ChatbotMemory.dataBalance = (cur + 1).toFixed(1) + ' GB';
      } else { ChatbotMemory.airtimeBalance += cost; }
    }
    ChatbotMemory.recentTransactions.unshift({
      type: txData.type, details: txData.details || type + ' Transaction',
      amt: cost, date: new Date().toISOString().split('T')[0]
    });
    StorageManager.save();
  },
  process(txData) {
    return new Promise((resolve, reject) => {
      if (!navigator.onLine) {
        OfflineTxQueue.enqueue(txData);
        reject({ status: 'FAILED', reason: 'Offline – muamala umesalia kwa usawazishaji', queued: true });
        return;
      }
      setTimeout(() => {
        const cost = txData.amount || txData.price || 0;
        if (!balanceSufficient(cost)) { reject({ status: 'FAILED', reason: 'Insufficient funds' }); return; }
        if (Math.random() > 0.12) {
          this.applyBalanceChanges(txData);
          FraudGuard.record();
          resolve({
            status: 'SUCCESS',
            ref: 'ST' + Math.floor(10000000 + Math.random() * 89999999),
            date: new Date().toLocaleDateString(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        } else {
          const reasons = ['Insufficient Funds', 'Network Timeout', 'Core Telecom API Offline', 'Payment gateway declined'];
          reject({ status: 'FAILED', reason: reasons[Math.floor(Math.random() * reasons.length)] });
        }
      }, 2000);
    });
  }
};

    const bub = document.createElement('div');
    bub.className = `bub ${sender}`;
    if (elementHTML) bub.innerHTML = elementHTML;
    else bub.innerText = text;
    const ts = document.createElement('span'); ts.className = 't';
    ts.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    bub.appendChild(ts);
    row.appendChild(bub);
    const typing = document.getElementById('typingIndicator');
    if (typing && typing.parentNode === box) box.insertBefore(row, typing);
    else box.appendChild(row);
    LayoutManager.scrollChatToEnd();
  },

  setChips(arr) {
    const c = document.getElementById('chipContainer');
    if (!c) return;
    c.innerHTML = '';
    (arr || []).forEach(label => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'chip'; btn.textContent = label;
      btn.onclick = () => { this.addMessage(label, 'user'); this.handleText(label); };
      c.appendChild(btn);
    });
  },

  sendMessage() {
    const el = document.getElementById('userInput');
    const val = el.value.trim();
    if (!val) return;
    el.value = '';
    LayoutManager.autoResizeTextarea(el);
    this.addMessage(val, 'user');
    this.handleText(val);
  },

  /* Central text dispatcher — slots first, then fresh intent */
  handleText(text) {
    const t = (text || '').trim();

    // System shortcuts
    if (/^(mwanzo|home|start|restart)$/i.test(t)) { this.resetToHome(); return; }
    if (/^(jaribu tena|retry)$/i.test(t)) { this.retryTransaction(); return; }

    // Slot filling — if we're waiting for specific info
    if (awaitingSlot === 'amount') { this.fillAmountSlot(t); return; }
    if (awaitingSlot === 'phone') { this.fillPhoneSlot(t); return; }
    if (awaitingSlot === 'meter') { this.fillMeterSlot(t); return; }
    if (awaitingSlot === 'voucher_code') { this.fillVoucherCodeSlot(t); return; }
    if (awaitingSlot === 'voucher_type') { this.fillVoucherTypeSlot(t); return; }
    if (awaitingSlot === 'bundle_choice') { this.fillBundleChoiceSlot(t); return; }
    if (awaitingSlot === 'more_help') { this.fillMoreHelpSlot(t); return; }

    // Fresh intent parse
    const parsed = parseIntent(t);
    const chipIntent = CHIP_INTENT_MAP[t];

    const intent = chipIntent || parsed.intent;
    if (!intent || intent === 'UNKNOWN') {
      this.showTyping(true);
      setTimeout(() => {
        this.showTyping(false);
        this.addMessage(this.translate('clarify'), 'bot');
        this.setChips(ChatbotMemory.lang === 'sw'
          ? ['Nunua Airtime', 'Kifurushi cha Data', 'SMS', 'Dakika', 'Tuma Pesa', 'Angalia Salio', 'LUKU', 'Vocha', 'Msaada']
          : ['Buy Airtime', 'Buy Data Bundle', 'SMS', 'Dakika', 'Send Money', 'Check Balance', 'LUKU', 'Voucher', 'Help']);
      }, 400);
      return;
    }

    // Pre-fill entities from parse
    if (parsed.amount) this.tx('amount', parsed.amount);
    if (parsed.phone) this.tx('phone', parsed.phone);
    if (parsed.meter) this.tx('meter', parsed.meter);
    if (parsed.product) this.tx('product', parsed.product);
    if (parsed.provider) this.tx('provider', parsed.provider);

    this.processIntent(intent, parsed);
  },

  /* =====================================================
     UNIVERSAL TRANSACTION PROCESSOR (docx spec)
     "One message → One intent → One PIN → One result."
     ===================================================== */
  processIntent(intent, entities) {
    entities = entities || {};
    if (entities.amount) this.tx('amount', entities.amount);
    if (entities.phone) this.tx('phone', entities.phone);
    if (entities.meter) this.tx('meter', entities.meter);
    if (entities.product) this.tx('product', entities.product);
    if (entities.provider) this.tx('provider', entities.provider);

    this.setChips([]);

    switch (intent) {
      case 'BUY_AIRTIME': return this.flowAirtime();
      case 'BUY_DATA':
      case 'BUY_DATA_BUNDLE': return this.flowData();
      case 'BUY_SMS': return this.flowSMS();
      case 'BUY_MINUTES':
      case 'BUY_MINUTE_BUNDLES': return this.flowMinutes();
      case 'SEND_MONEY': return this.flowMoney();
      case 'CHECK_BALANCE': return this.flowBalance();
      case 'REDEEM_VOUCHER': return this.flowVoucher();
      case 'MY_ACCOUNT': return this.showAccount();
      case 'BUY_LUKU': return this.flowLuku();
      case 'GET_HELP': return this.showHelp();
      default: this.resetToHome();
    }
  },

  /* ---- AIRTIME FLOW ---- */
  flowAirtime() {
    currentTx.type = 'AIRTIME';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      if (!currentTx.amount) {
        // Ask for amount only
        awaitingSlot = 'amount';
        const html = `
          <div style="font-weight:600;margin-bottom:8px;">📱 ${ChatbotMemory.lang==='sw'?'Chagua kiasi cha airtime:':'Choose airtime amount:'}</div>
          <button class="btn-block" onclick="Engine.pickAmt(1000)">Tsh 1,000</button>
          <button class="btn-block" onclick="Engine.pickAmt(2000)">Tsh 2,000</button>
          <button class="btn-block" onclick="Engine.pickAmt(5000)">Tsh 5,000</button>
          <button class="btn-block" onclick="Engine.pickAmt(10000)">Tsh 10,000</button>
          <div style="font-size:11.5px;color:var(--mut);margin-top:6px;">${ChatbotMemory.lang==='sw'?'Au andika kiasi 👇':'Or type any amount 👇'}</div>`;
        this.addMessage(null, 'bot', html);
        return;
      }
      this.proceedToPayment('AIRTIME');
    }, 400);
  },

  pickAmt(amt) { this.addMessage('Tsh ' + amt.toLocaleString(), 'user'); currentTx.amount = amt; this.proceedToPayment(currentTx.type || 'AIRTIME'); },
  fillAmountSlot(t) {
    const amt = normalizeAmount(t) || parseInt(t.replace(/\D/g,''),10);
    if (amt > 0) { awaitingSlot = null; currentTx.amount = amt; this.proceedToPayment(currentTx.type || 'AIRTIME'); }
    else this.addMessage(this.translate('ask_missing_amount'), 'bot');
  },

  /* ---- DATA FLOW ---- */
  flowData() {
    currentTx.type = 'DATA';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      // If product/amount already known, skip menu
      const bundle = this.resolveDataBundle();
      if (bundle) {
        currentTx.price = bundle.price;
        currentTx.details = `Data: ${bundle.name} (${bundle.validity})`;
        this.proceedToPayment('DATA');
        return;
      }
      // Show bundle menu
      awaitingSlot = 'bundle_choice';
      let html = `<div style="font-weight:600;margin-bottom:8px;">📶 ${ChatbotMemory.lang==='sw'?'Chagua kifurushi:':'Choose a bundle:'}</div>`;
      const allBundles = [...DATA_CATALOGUE.Daily, ...DATA_CATALOGUE.Weekly, ...DATA_CATALOGUE.Monthly];
      allBundles.forEach((b, i) => {
        html += `<button class="btn-block" onclick="Engine.pickBundle(${i})" style="text-align:left;display:flex;justify-content:space-between;align-items:center;">
          <span>${b.name}</span><span style="font-size:11px;opacity:.7;">${b.validity} · Tsh ${b.price.toLocaleString()}</span>
        </button>`;
      });
      this._dataBundleList = allBundles;
      this.addMessage(null, 'bot', html);
    }, 400);
  },

  resolveDataBundle() {
    const all = [...DATA_CATALOGUE.Daily, ...DATA_CATALOGUE.Weekly, ...DATA_CATALOGUE.Monthly];
    // Match by product string e.g. "2GB"
    if (currentTx.product) {
      const gb = parseFloat(currentTx.product);
      if (gb) { const found = all.find(b => b.gb === gb || b.name.toLowerCase().includes(currentTx.product.toLowerCase())); if (found) return found; }
    }
    // Match by exact price
    if (currentTx.amount) { const found = all.find(b => b.price === currentTx.amount); if (found) return found; }
    return null;
  },

  pickBundle(idx) {
    awaitingSlot = null;
    const b = this._dataBundleList[idx];
    this.addMessage(b.name + ' – Tsh ' + b.price.toLocaleString(), 'user');
    currentTx.price = b.price;
    currentTx.amount = b.price;
    currentTx.details = `Data: ${b.name} (${b.validity})`;
    this.proceedToPayment('DATA');
  },

  fillBundleChoiceSlot(t) {
    const parsed = parseIntent(t);
    if (parsed.product || parsed.amount) {
      awaitingSlot = null;
      if (parsed.product) currentTx.product = parsed.product;
      if (parsed.amount) currentTx.amount = parsed.amount;
      this.flowData();
    } else { this.addMessage(this.translate('ask_bundle_choice'), 'bot'); }
  },

  /* ---- SMS FLOW ---- */
  flowSMS() {
    currentTx.type = 'SMS';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      // Auto-match by amount
      if (currentTx.amount) {
        const match = SMS_CATALOGUE.find(s => s.price === currentTx.amount) || SMS_CATALOGUE.reduce((best, s) => Math.abs(s.price - currentTx.amount) < Math.abs(best.price - currentTx.amount) ? s : best);
        currentTx.details = `${match.name} SMS Package`;
        currentTx.amount = match.price;
        this.proceedToPayment('SMS');
        return;
      }
      // Show SMS catalogue
      awaitingSlot = 'bundle_choice';
      this._smsMode = true;
      let html = `<div style="font-weight:600;margin-bottom:8px;">💬 ${ChatbotMemory.lang==='sw'?'Chagua kifurushi cha SMS:':'Choose SMS package:'}</div>`;
      SMS_CATALOGUE.forEach((s, i) => {
        html += `<button class="btn-block" onclick="Engine.pickSMS(${i})">${s.name} – Tsh ${s.price.toLocaleString()}</button>`;
      });
      html += `<div style="font-size:11.5px;color:var(--mut);margin-top:6px;">${ChatbotMemory.lang==='sw'?'Au andika kiasi 👇':'Or type amount 👇'}</div>`;
      this.addMessage(null, 'bot', html);
    }, 400);
  },

  pickSMS(idx) {
    awaitingSlot = null; this._smsMode = false;
    const s = SMS_CATALOGUE[idx];
    this.addMessage(s.name + ' – Tsh ' + s.price.toLocaleString(), 'user');
    currentTx.amount = s.price;
    currentTx.details = `${s.name} SMS Package`;
    this.proceedToPayment('SMS');
  },

  /* ---- MINUTES FLOW ---- */
  flowMinutes() {
    currentTx.type = 'MINUTES';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      if (currentTx.amount) {
        const match = MINUTE_CATALOGUE.reduce((best, m) => Math.abs(m.price - currentTx.amount) < Math.abs(best.price - currentTx.amount) ? m : best);
        currentTx.details = `${match.name} Voice Bundle`;
        currentTx.amount = match.price;
        this.proceedToPayment('MINUTES');
        return;
      }
      awaitingSlot = 'bundle_choice';
      this._minuteMode = true;
      let html = `<div style="font-weight:600;margin-bottom:8px;">📞 ${ChatbotMemory.lang==='sw'?'Chagua kifurushi cha dakika:':'Choose minutes bundle:'}</div>`;
      MINUTE_CATALOGUE.forEach((m, i) => {
        html += `<button class="btn-block" onclick="Engine.pickMinute(${i})">${m.name} – Tsh ${m.price.toLocaleString()}</button>`;
      });
      this.addMessage(null, 'bot', html);
    }, 400);
  },

  pickMinute(idx) {
    awaitingSlot = null; this._minuteMode = false;
    const m = MINUTE_CATALOGUE[idx];
    this.addMessage(m.name + ' – Tsh ' + m.price.toLocaleString(), 'user');
    currentTx.amount = m.price;
    currentTx.details = `${m.name} Voice Bundle`;
    this.proceedToPayment('MINUTES');
  },

  /* ---- MONEY FLOW ---- */
  flowMoney() {
    currentTx.type = 'MONEY';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      // If phone known, auto-detect network
      if (currentTx.phone) {
        const net = detectNetwork(currentTx.phone);
        if (net && !currentTx.provider) {
          currentTx.provider = net;
          currentTx.wallet = networkWallet(net);
        }
      }
      if (!currentTx.phone) { awaitingSlot = 'phone'; this.addMessage(this.translate('ask_missing_phone'), 'bot'); return; }
      if (!currentTx.amount) { awaitingSlot = 'amount'; this.addMessage(this.translate('ask_missing_amount'), 'bot'); return; }
      this.showMoneySummaryAndPIN();
    }, 400);
  },

  fillPhoneSlot(t) {
    const phone = extractPhone(t) || (t.replace(/\D/g,'').length >= 9 ? t.replace(/\s/g,'') : null);
    if (phone) {
      awaitingSlot = null;
      currentTx.phone = phone;
      const net = detectNetwork(phone);
      if (net) { currentTx.provider = net; currentTx.wallet = networkWallet(net); }
      if (!currentTx.amount) { awaitingSlot = 'amount'; this.addMessage(this.translate('ask_missing_amount'), 'bot'); return; }
      this.showMoneySummaryAndPIN();
    } else { this.addMessage(this.translate('ask_missing_phone'), 'bot'); }
  },

  showMoneySummaryAndPIN() {
    const isSw = ChatbotMemory.lang === 'sw';
    const net = currentTx.provider || detectNetwork(currentTx.phone) || '—';
    const wallet = currentTx.wallet || networkWallet(net) || 'M-Pesa';
    currentTx.details = `Tuma Tsh ${Number(currentTx.amount).toLocaleString()} → ${currentTx.phone} via ${wallet}`;
    if (!FraudGuard.check(currentTx)) { this.addMessage(this.translate('fraud_block'), 'bot'); return; }
    const balAfter = ChatbotMemory.walletBalance - currentTx.amount;
    const html = `
      <div class="rcard" style="border-left:4px solid var(--g8);">
        <div class="rcard-title">💸 ${isSw?'THIBITISHA KUTUMA PESA':'CONFIRM MONEY TRANSFER'}</div>
        <div class="rcard-row"><span>${isSw?'Mpokeaji':'Recipient'}</span><span>${currentTx.phone}</span></div>
        <div class="rcard-row"><span>${isSw?'Mtandao (imegunduliwa)':'Network (auto-detected)'}</span><span>${net} / ${wallet}</span></div>
        <div class="rcard-row"><span>${isSw?'Kiasi':'Amount'}</span><span style="font-weight:700;color:var(--g8);">Tsh ${Number(currentTx.amount).toLocaleString()}</span></div>
        <div class="rcard-row"><span>${isSw?'Salio Baada':'Balance After'}</span><span>Tsh ${balAfter.toLocaleString()}</span></div>
      </div>`;
    this.addMessage(null, 'bot', html);
    setTimeout(() => this.showInlinePIN('MONEY'), 300);
  },

  /* ---- LUKU FLOW ---- */
  flowLuku() {
    currentTx.type = 'LUKU';
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      if (!currentTx.meter) { awaitingSlot = 'meter'; this.addMessage(this.translate('ask_missing_meter'), 'bot'); return; }
      if (!currentTx.amount) { awaitingSlot = 'amount'; this.addMessage(this.translate('ask_missing_amount'), 'bot'); return; }
      this.showLukuSummaryAndPIN();
    }, 400);
  },

  fillMeterSlot(t) {
    const m = extractMeter(t) || (t.replace(/\D/g,'').length >= 11 ? t.replace(/\D/g,'') : null);
    if (m) {
      awaitingSlot = null; currentTx.meter = m;
      if (!currentTx.amount) { awaitingSlot = 'amount'; this.addMessage(this.translate('ask_missing_amount'), 'bot'); return; }
      this.showLukuSummaryAndPIN();
    } else { this.addMessage(this.translate('ask_missing_meter'), 'bot'); }
  },

  showLukuSummaryAndPIN() {
    const isSw = ChatbotMemory.lang === 'sw';
    const approxUnits = (currentTx.amount / 210).toFixed(1);
    currentTx.details = `LUKU Meita ${currentTx.meter} – Tsh ${Number(currentTx.amount).toLocaleString()}`;
    if (!FraudGuard.check(currentTx)) { this.addMessage(this.translate('fraud_block'), 'bot'); return; }
    const html = `
      <div class="rcard" style="border-left:4px solid var(--y7);">
        <div class="rcard-title">⚡ ${isSw?'THIBITISHA UNUNUZI WA LUKU':'CONFIRM LUKU PURCHASE'}</div>
        <div class="rcard-row"><span>${isSw?'Namba ya Meita':'Meter Number'}</span><span style="font-family:monospace;">${currentTx.meter}</span></div>
        <div class="rcard-row"><span>${isSw?'Kiasi':'Amount'}</span><span style="font-weight:700;color:var(--g8);">Tsh ${Number(currentTx.amount).toLocaleString()}</span></div>
        <div class="rcard-row"><span>${isSw?'Wastani wa Vitengo':'Est. Units'}</span><span>~${approxUnits} kWh</span></div>
        <div class="rcard-row"><span>${isSw?'Salio Baada':'Balance After'}</span><span>Tsh ${(ChatbotMemory.walletBalance - currentTx.amount).toLocaleString()}</span></div>
      </div>`;
    this.addMessage(null, 'bot', html);
    setTimeout(() => this.showInlinePIN('LUKU'), 300);
  },

  /* ---- BALANCE FLOW ---- */
  flowBalance() {
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      const isSw = ChatbotMemory.lang === 'sw';
      const html = `
        <div class="rcard">
          <div class="rcard-title">💰 ${isSw?'Salio Lako':'Your Balances'}</div>
          <div class="rcard-row"><span>${isSw?'Airtime':'Airtime'}</span><span>Tsh ${ChatbotMemory.airtimeBalance.toLocaleString()}</span></div>
          <div class="rcard-row"><span>Data</span><span>${ChatbotMemory.dataBalance}</span></div>
          <div class="rcard-row"><span>${isSw?'Wallet (M-Money)':'Wallet (M-Money)'}</span><span>Tsh ${ChatbotMemory.walletBalance.toLocaleString()}</span></div>
          <div style="font-size:10px;color:var(--mut);margin-top:6px;">${ChatbotMemory.network} • ${new Date().toLocaleTimeString()}</div>
        </div>`;
      this.addMessage(null, 'bot', html);
      this.askMoreHelp();
    }, 500);
  },

  /* ---- VOUCHER FLOW ---- */
  flowVoucher() {
    if (!currentTx.voucherType) {
      awaitingSlot = 'voucher_type';
      const html = `
        <div class="qa-grid">
          <div class="qa-tile" onclick="Engine.pickVoucherType('AIRTIME')">🎫<br>Airtime</div>
          <div class="qa-tile" onclick="Engine.pickVoucherType('DATA')">📶<br>Data</div>
        </div>`;
      this.addMessage(ChatbotMemory.lang==='sw'?'Chagua aina ya vocha:':'Choose voucher type:', 'bot');
      this.addMessage(null, 'bot', html);
      return;
    }
    awaitingSlot = 'voucher_code';
    const demo = currentTx.voucherType === 'AIRTIME' ? 'STAIR1000, DEMO12345' : 'STDATA1GB, DEMO54321';
    this.addMessage(`${this.translate('ask_missing_voucher')} (Demo: ${demo})`, 'bot');
  },

  pickVoucherType(type) { awaitingSlot = null; currentTx.voucherType = type; this.addMessage(type, 'user'); this.flowVoucher(); },
  fillVoucherTypeSlot(t) {
    if (/airtime/i.test(t)) { awaitingSlot = null; currentTx.voucherType = 'AIRTIME'; this.flowVoucher(); }
    else if (/data/i.test(t)) { awaitingSlot = null; currentTx.voucherType = 'DATA'; this.flowVoucher(); }
    else { this.addMessage(ChatbotMemory.lang==='sw'?'Chagua: Airtime au Data.':'Choose: Airtime or Data.', 'bot'); }
  },
  fillVoucherCodeSlot(t) {
    if (t.length < 5) { this.addMessage(this.translate('invalid_voucher'), 'bot'); return; }
    awaitingSlot = null;
    currentTx.voucherCode = t.toUpperCase().replace(/\s/g, '');
    currentTx.type = 'VOUCHER';
    this.addMessage(this.translate('balance_fetch'), 'bot');
    VoucherService.validate(currentTx.voucherCode, currentTx.voucherType)
      .then(res => {
        currentTx.amount = res.amount;
        currentTx.details = `Vocha ${currentTx.voucherType} (${res.code})`;
        this.showInlinePIN('VOUCHER');
      })
      .catch(() => { awaitingSlot = 'voucher_code'; this.addMessage(this.translate('invalid_voucher'), 'bot'); });
  },

  showAccount() {

        recentHTML += `<div style="font-size:11px;border-bottom:1px solid var(--bdr);padding:3px 0;">• ${t.details} – Tsh ${t.amt} (${t.date})</div>`;

        <div class="rcard">

          <div class="rcard-row"><span>Mtandao:</span><span>${ChatbotMemory.network}</span></div>
          <div class="rcard-row"><span>Wallet:</span><span>Tsh ${ChatbotMemory.walletBalance.toLocaleString()}</span></div>
          <div class="rcard-row"><span>Airtime:</span><span>Tsh ${ChatbotMemory.airtimeBalance.toLocaleString()}</span></div>
          <div style="margin-top:8px;font-weight:600;font-size:11.5px;color:var(--g8);">Miamala ya Hivi Karibuni:</div>
          ${recentHTML}
        </div>`;
      this.addMessage(null, 'bot', html);
      this.askMoreHelp();
    }, 500);
  },

  /* ---- HELP ---- */
  showHelp() {
    const html = `
      <div class="rcard">
        <div class="rcard-title">💡 Msaada & Huduma</div>
        <button class="btn-block" style="font-size:12px;padding:8px;" onclick="alert('FAQs loading...')">Maswali Yanayoulizwa Sana (FAQs)</button>
        <button class="btn-block" style="font-size:12px;padding:8px;" onclick="alert('Connecting to live agent...')">Ongea na Muhudumu</button>
        <button class="btn-block" style="font-size:12px;padding:8px;" onclick="Engine.resetToHome()">Rudi Mwanzo</button>
      </div>`;
    this.addMessage(null, 'bot', html);
  },

  /* ==========================================
     PROCEED TO PAYMENT — auto balance check (docx spec)
     ========================================== */
  proceedToPayment(type) {
    const cost = currentTx.amount || currentTx.price || 0;
    const isSw = ChatbotMemory.lang === 'sw';

    // Auto balance check before any purchase
    if (!balanceSufficient(cost)) {
      const shortfall = cost - ChatbotMemory.walletBalance;
      const html = `
        <div class="rcard" style="border-left:4px solid var(--r6);background:var(--r1);">
          <div style="font-weight:700;color:var(--r6);margin-bottom:6px;">⚠️ ${this.translate('insufficient')}</div>
          <div style="font-size:12.5px;">
            ${isSw ? `Unahitaji Tsh ${shortfall.toLocaleString()} zaidi.` : `You need Tsh ${shortfall.toLocaleString()} more.`}
          </div>
          <div style="font-size:12px;color:var(--mut);margin-top:4px;">
            ${isSw?'Ongeza salio kupitia:':'Top up via:'}
          </div>
          <button class="btn-block" style="margin-top:8px;" onclick="Engine.pickAltPayment('M-Pesa')">📱 M-Pesa</button>
          <button class="btn-block" onclick="Engine.pickAltPayment('Tigo Pesa')">Tigo Pesa</button>
          <button class="btn-block" onclick="Engine.pickAltPayment('Airtel Money')">Airtel Money</button>
          <button class="btn-sub" style="width:100%;margin-top:6px;" onclick="Engine.resetToHome()">${this.translate('cancel')}</button>
        </div>`;
      this.addMessage(null, 'bot', html);
      return;
    }

    // Set details if not set
    if (!currentTx.details) {
      if (type === 'AIRTIME') currentTx.details = `Airtime Recharge Tsh ${currentTx.amount}`;
      else if (type === 'SMS') currentTx.details = currentTx.details || `SMS Package Tsh ${currentTx.amount}`;
      else if (type === 'MINUTES') currentTx.details = currentTx.details || `Minutes Bundle Tsh ${currentTx.amount}`;
      else currentTx.details = `${type} Tsh ${currentTx.amount || currentTx.price}`;
    }

    // Show mini-summary + go straight to PIN
    const cost2 = currentTx.price || currentTx.amount;
    const html = `
      <div class="rcard" style="border-left:4px solid var(--g5);">
        <div class="rcard-title">✅ ${isSw?'THIBITISHA':'CONFIRM'}</div>
        <div class="rcard-row"><span>${isSw?'Huduma':'Service'}</span><span>${currentTx.details}</span></div>
        <div class="rcard-row"><span>${isSw?'Kiasi':'Amount'}</span><span style="font-weight:700;color:var(--g8);">Tsh ${Number(cost2).toLocaleString()}</span></div>
        <div class="rcard-row"><span>${isSw?'Salio Baada':'Balance After'}</span><span>Tsh ${(ChatbotMemory.walletBalance - cost2).toLocaleString()}</span></div>
      </div>`;
    this.addMessage(null, 'bot', html);
    setTimeout(() => this.showInlinePIN(type), 300);
  },

  pickAltPayment(method) {
    currentTx.provider = method;
    currentTx.paymentSource = method;
    this.addMessage(method, 'user');
    this.showInlinePIN(currentTx.type || 'TX');
  },

  /* ==========================================
     INLINE PIN (in-chat keypad, no modal)
     ========================================== */
  _pin: '',
  _pinTarget: null,

  showInlinePIN(target) {
    this._pin = '';
    this._pinTarget = target;
    const isSw = ChatbotMemory.lang === 'sw';
    const pinId = 'pin_' + Date.now();
    this._pinId = pinId;
    const html = `
      <div class="rcard" style="border-left:4px solid var(--g8);" id="${pinId}">
        <div class="rcard-title">🔒 ${this.translate('pin_msg')}</div>
        <div class="pin-dots" id="${pinId}_dots">
          <span class="pin-dot" id="${pinId}_d0"></span>
          <span class="pin-dot" id="${pinId}_d1"></span>
          <span class="pin-dot" id="${pinId}_d2"></span>
          <span class="pin-dot" id="${pinId}_d3"></span>
        </div>
        <div class="pin-grid" id="${pinId}_grid">
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','1')">1</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','2')">2</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','3')">3</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','4')">4</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','5')">5</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','6')">6</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','7')">7</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','8')">8</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','9')">9</div>
          <div class="pin-btn" style="background:var(--r1);color:var(--r6);font-size:14px;" onclick="Engine.deletePin('${pinId}')">⌫</div>
          <div class="pin-btn" onclick="Engine.pressPin('${pinId}','0')">0</div>
          <div class="pin-btn" style="background:var(--g1);color:var(--g8);font-size:14px;" onclick="Engine.submitPin('${pinId}')">✓</div>
        </div>
        <div id="${pinId}_err" style="font-size:11.5px;color:var(--r6);text-align:center;margin-top:6px;min-height:14px;"></div>
        <button class="btn-sub" style="width:100%;margin-top:8px;" onclick="Engine.cancelPin('${pinId}')">${this.translate('cancel')}</button>
      </div>`;
    this.addMessage(null, 'bot', html);
  },

  pressPin(id, d) {
    if (this._pin.length >= 4) return;
    this._pin += d;
    this._updatePinDots(id);
    if (this._pin.length === 4) setTimeout(() => this.submitPin(id), 250);
  },
  deletePin(id) { if (this._pin.length > 0) { this._pin = this._pin.slice(0,-1); this._updatePinDots(id); } },
  _updatePinDots(id) {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(id + '_d' + i);
      if (dot) dot.classList.toggle('filled', i < this._pin.length);
    }
  },
  submitPin(id) {
    if (this._pin.length < 4) {
      const e = document.getElementById(id + '_err');
      if (e) e.textContent = ChatbotMemory.lang==='sw'?'Weka tarakimu 4.':'Enter 4 digits.';
      return;
    }
    const grid = document.getElementById(id + '_grid');
    if (grid) grid.style.pointerEvents = 'none';
    this.addMessage('●●●●', 'user');
    this.executeTransaction();
  },
  cancelPin(id) {
    const card = document.getElementById(id);
    if (card && card.parentElement && card.parentElement.parentElement) card.parentElement.parentElement.remove();
    this.addMessage(ChatbotMemory.lang==='sw'?'Muamala umeghairiwa.':'Transaction cancelled.', 'bot');
    resetTx();
    this.askMoreHelp();
  },

  /* ==========================================
     EXECUTE + RECEIPT
     ========================================== */
  executeTransaction() {
    const shimID = 'shim_' + Date.now();
    const shimHTML = `
      <div class="rcard" id="${shimID}">
        <div class="rcard-title">⚙️ ${this.translate('processing')}</div>
        <div class="shimmer" style="height:12px;margin-top:8px;border-radius:6px;width:100%;"></div>
        <div class="shimmer" style="height:12px;margin-top:4px;border-radius:6px;width:70%;"></div>
      </div>`;
    this.addMessage(null, 'bot', shimHTML);
    TransactionEngine.process(currentTx)
      .then(res => this.showResult(shimID, res, null))
      .catch(err => this.showResult(shimID, null, err));
  },

  showResult(shimID, res, err) {
    const shim = document.getElementById(shimID);
    if (shim && shim.parentElement && shim.parentElement.parentElement) shim.parentElement.parentElement.remove();
    const isSw = ChatbotMemory.lang === 'sw';
    if (res && res.status === 'SUCCESS') {
      const html = `
        <div class="rcard" style="border-left:4px solid var(--g5);">
          <div style="color:var(--g8);font-weight:700;font-size:14px;margin-bottom:6px;">${this.translate('success')}</div>
          <div class="rcard-row"><span>${isSw?'Namba ya Ref':'Ref Number'}</span><span>${res.ref}</span></div>
          <div class="rcard-row"><span>${isSw?'Tarehe/Saa':'Date/Time'}</span><span>${res.date} | ${res.time}</span></div>
          <div class="rcard-row"><span>${isSw?'Muamala':'Transaction'}</span><span>${currentTx.details}</span></div>
        </div>`;
      this.addMessage(null, 'bot', html);
    } else {
      const reason = (err && err.reason) || 'System Error';
      const queued = err && err.queued;
      const html = `
        <div class="rcard" style="border-left:4px solid var(--r6);background:var(--r1);">
          <div style="color:var(--r6);font-weight:700;font-size:14px;margin-bottom:4px;">${this.translate('failed')}</div>
          <div style="font-size:12px;">${reason}</div>
          ${queued ? `<div style="font-size:11px;margin-top:4px;">${isSw?'Itasawazishwa ukiwa mtandaoni.':'Will sync when online.'}</div>` : ''}
          <button class="btn-block" style="background:var(--r6);margin-top:8px;" onclick="Engine.retryTransaction()">🔄 ${this.translate('retry')}</button>
        </div>`;
      this.addMessage(null, 'bot', html);
    }
    resetTx();
    this.askMoreHelp();
  },

  retryTransaction() { this.showInlinePIN(currentTx.type || 'TX'); },

  askMoreHelp() {
    setTimeout(() => {
      this.addMessage(this.translate('more_help'), 'bot');
      awaitingSlot = 'more_help';
      this.setChips(ChatbotMemory.lang==='sw' ? ['NDIYO', 'HAPANA, ASANTE'] : ['YES', 'NO, THANK YOU']);
    }, 800);
  },

  fillMoreHelpSlot(t) {
    awaitingSlot = null;
    if (/^(ndiyo|yes|ndio)\b/i.test(t) || t.toLowerCase() === 'yes') {
      this.setChips([]);
      resetTx();
      this.addMessage(ChatbotMemory.lang==='sw'?'Unaweza kuandika au kuchagua huduma:':'Type or choose a service:', 'bot');
      this.renderServiceGrid();
    } else if (/hapana|no|asante|thank/i.test(t)) {
      this.endChat();
    } else {
      // Treat as a fresh message
      this.handleText(t);
    }
  },

  endChat() {
    this.setChips([]);
    const html = `
      <div class="rcard">
        <div style="font-weight:600;">${this.translate('goodbye')}</div>
        <button class="btn-block" style="margin-top:10px;" onclick="Engine.resetToHome()">${ChatbotMemory.lang==='sw'?'Anza Tena':'Start Again'}</button>
      </div>`;
    this.addMessage(null, 'bot', html);
  },

  renderServiceGrid() {
    const gridHTML = `
      <div class="qa-grid">
        <div class="qa-tile" data-intent="BUY_AIRTIME" role="button" tabindex="0"><div class="qa-icon">📱</div>Airtime</div>
        <div class="qa-tile" data-intent="BUY_DATA" role="button" tabindex="0"><div class="qa-icon">📶</div>Data</div>
        <div class="qa-tile" data-intent="SEND_MONEY" role="button" tabindex="0"><div class="qa-icon">💸</div>Send Money</div>
        <div class="qa-tile" data-intent="CHECK_BALANCE" role="button" tabindex="0"><div class="qa-icon">💰</div>Balance</div>
        <div class="qa-tile" data-intent="BUY_SMS" role="button" tabindex="0"><div class="qa-icon">💬</div>SMS</div>
        <div class="qa-tile" data-intent="BUY_MINUTES" role="button" tabindex="0"><div class="qa-icon">📞</div>Dakika</div>
        <div class="qa-tile" data-intent="BUY_LUKU" role="button" tabindex="0"><div class="qa-icon">⚡</div>LUKU</div>
        <div class="qa-tile" data-intent="REDEEM_VOUCHER" role="button" tabindex="0"><div class="qa-icon">🎫</div>Voucher</div>
      </div>`;
    this.addMessage(null, 'bot', gridHTML);
  },

  resetToHome() {
    resetTx();
    this.renderWelcome();
  },

  renderWelcome() {
    const box = document.getElementById('chatBox');
    if (box) {
      const dateLbl = box.querySelector('.date-lbl');
      const typing = document.getElementById('typingIndicator');
      box.innerHTML = '';
      if (dateLbl) box.appendChild(dateLbl);
      if (typing) box.appendChild(typing);
    }
    this.setChips([]);
    this.showTyping(true);
    setTimeout(() => {
      this.showTyping(false);
      const gridHTML = `
        <div>${this.translate('welcome').replace(/\n/g,'<br>')}</div>
        <div class="qa-grid">
          <div class="qa-tile" data-intent="BUY_AIRTIME" role="button" tabindex="0"><div class="qa-icon">📱</div>Airtime</div>
          <div class="qa-tile" data-intent="BUY_DATA" role="button" tabindex="0"><div class="qa-icon">📶</div>Data</div>
          <div class="qa-tile" data-intent="SEND_MONEY" role="button" tabindex="0"><div class="qa-icon">💸</div>Send Money</div>
          <div class="qa-tile" data-intent="CHECK_BALANCE" role="button" tabindex="0"><div class="qa-icon">💰</div>Balance</div>
          <div class="qa-tile" data-intent="BUY_SMS" role="button" tabindex="0"><div class="qa-icon">💬</div>SMS</div>
          <div class="qa-tile" data-intent="BUY_MINUTES" role="button" tabindex="0"><div class="qa-icon">📞</div>Dakika</div>
          <div class="qa-tile" data-intent="BUY_LUKU" role="button" tabindex="0"><div class="qa-icon">⚡</div>LUKU</div>
          <div class="qa-tile" data-intent="REDEEM_VOUCHER" role="button" tabindex="0"><div class="qa-icon">🎫</div>Voucher</div>
        </div>`;
      this.addMessage(null, 'bot', gridHTML);
    }, 400);
  },

  /* ---- Speech ---- */
  initSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { const b = document.getElementById('micBtn'); if (b) b.style.display='none'; return; }
    this.recognition = new SR();
    this.recognition.continuous = false;
    this.recognition.interimResults = false;
    this.recognition.lang = ChatbotMemory.lang === 'en' ? 'en-TZ' : 'sw-TZ';
    this._pendingVoice = false;
    this.recognition.onstart = () => { this.isListening = true; document.getElementById('micBtn').classList.add('recording'); document.getElementById('userInput').placeholder = '🎙️ Listening...'; };
    this.recognition.onresult = e => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript; if (t) { document.getElementById('userInput').value = t; this._pendingVoice = true; } };
    this.recognition.onerror = () => { this.addMessage('🎙️ Sikio halijasomeka. Jaribu tena.', 'bot'); };
    this.recognition.onend = () => { this.isListening = false; document.getElementById('micBtn').classList.remove('recording'); document.getElementById('userInput').placeholder = 'Andika hapa / Type message...'; if (this._pendingVoice) { this._pendingVoice = false; this.sendMessage(); } };
  },
  toggleMic() { if (!this.recognition) { this.addMessage('🎙️ Voice input not supported.', 'bot'); return; } this.isListening ? this.recognition.stop() : this.recognition.start(); }
};

/* ==========================================
   LAYOUT MANAGER
   ========================================== */
const LayoutManager = {
  app: null, chatBox: null,
  init() {
    this.app = document.getElementById('appShell');
    this.chatBox = document.getElementById('chatBox');
    this.updateViewport();
    window.addEventListener('resize', () => this.updateViewport());
    window.addEventListener('orientationchange', () => setTimeout(() => this.updateViewport(), 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => this.updateViewport());
      window.visualViewport.addEventListener('scroll', () => this.updateViewport());
    }
    const input = document.getElementById('userInput');
    if (input) this.autoResizeTextarea(input);
  },
  updateViewport() {
    if (!this.app) return;
    const vv = window.visualViewport;
    const mob = window.matchMedia('(max-width:520px),(pointer:coarse)').matches;
    if (vv && mob) { this.app.style.height = Math.round(vv.height) + 'px'; this.app.style.marginTop = Math.round(vv.offsetTop) + 'px'; }
    else { this.app.style.height = ''; this.app.style.marginTop = ''; }
    this.scrollChatToEnd();
  },
  autoResizeTextarea(el) { if (!el) return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; this.scrollChatToEnd(); },
  scrollChatToEnd() { if (!this.chatBox) return; requestAnimationFrame(() => { this.chatBox.scrollTop = this.chatBox.scrollHeight; }); }
};

window.Engine = Engine;
window.LayoutManager = LayoutManager;

function bootSemaTel() {
  if (bootSemaTel.done) return;
  bootSemaTel.done = true;
  try { Engine.init(); }
  catch (err) {
    console.error('SemaTel init failed:', err);
    const box = document.getElementById('chatBox');
    if (box) box.insertAdjacentHTML('beforeend','<div class="mrow"><div class="bub bot">Hitilafu. Pakia upya ukurasa (Ctrl+Shift+R).</div></div>');
  }
}
bootSemaTel.done = false;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootSemaTel);
else bootSemaTel();
</script>
