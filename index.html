<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SemaTel"/>
<meta name="theme-color" content="#0a5c36"/>
<meta name="description" content="Tanzania's premium AI-powered financial & telecom super-app"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<title>SemaTel – AI Chatbot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Tanzania brand palette */
  --kili-peak:#0a5c36;
  --savanna-deep:#1a7a48;
  --emerald:#22a05a;
  --leaf:#2ec278;
  --gold-deep:#b8860b;
  --gold:#d4a017;
  --gold-bright:#f5c842;
  --gold-pale:#fff8e0;
  --onyx:#0d1117;
  --charcoal:#1e2530;
  --slate:#374151;
  --muted:#6b7280;
  --silver:#9ca3af;
  --light:#f3f4f6;
  --white:#ffffff;
  --blue-tz:#1a5fb4;
  --r6:#dc2626;--r1:#fef2f2;
  /* gradients */
  --grad-hdr: linear-gradient(135deg,#0a5c36 0%,#1a7a48 40%,#d4a017 100%);
  --grad-hero: linear-gradient(160deg,#0a5c36 0%,#22a05a 50%,#b8860b 100%);
  --grad-card: linear-gradient(145deg,#1a7a48,#0a5c36);
  --grad-gold: linear-gradient(135deg,#d4a017,#f5c842);
  --grad-blue: linear-gradient(135deg,#1a5fb4,#4078c8);
  --bg-chat: #f0f4f0;
  --bdr:rgba(0,0,0,.08);
  --sh:0 8px 32px rgba(0,0,0,.18);
  --sh-card:0 4px 20px rgba(10,92,54,.15);
  --fd:'Space Grotesk',sans-serif;
  --fb:'Plus Jakarta Sans',sans-serif;
  --app-max:480px;
  --hdr-h:64px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}
html{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:var(--fb);background:#1a2332;
  margin:0;padding:0;overflow:hidden;
  min-height:100%;min-height:100dvh;
  display:flex;justify-content:center;align-items:stretch;
  font-size:16px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.app{
  width:100%;max-width:var(--app-max);height:100%;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg-chat);
  position:relative;overflow:hidden;
  padding-left:var(--sal);padding-right:var(--sar);
}
@media(min-width:520px){
  body{padding:16px 0;background:linear-gradient(135deg,#0d1117 0%,#1a2332 100%)}
  .app{border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.5);height:calc(100dvh - 32px);max-height:900px}
}

/* ========== HEADER ========== */
.hdr{
  flex:0 0 auto;min-height:var(--hdr-h);
  background:var(--grad-hdr);
  display:flex;align-items:center;gap:10px;
  color:var(--white);padding:var(--sat) 12px 0;
  position:relative;z-index:20;
  box-shadow:0 2px 24px rgba(10,92,54,.4);
}
.hdr::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(245,200,66,.4),transparent);
}
.hdr-back{
  width:40px;height:40px;min-width:40px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.12);transition:background .15s;
}
.hdr-back::before{
  content:'';width:9px;height:9px;
  border-left:2.5px solid rgba(255,255,255,.9);border-bottom:2.5px solid rgba(255,255,255,.9);
  transform:rotate(45deg);margin-left:3px;
}
.hdr-back:active{background:rgba(255,255,255,.2)}


.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo>div{min-width:0}
.logo-name{
  font-family:var(--fd);font-weight:700;font-size:18px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#fff 60%,#f5c842);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:11.5px;opacity:.75;white-space:nowrap;font-weight:500;letter-spacing:.3px}
.hdr-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.hdr-btn{
  width:36px;height:36px;border:none;border-radius:10px;
  background:rgba(255,255,255,.12);color:#fff;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.net-badge{
  padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;
  background:rgba(245,200,66,.25);border:1px solid rgba(245,200,66,.4);
  color:#f5c842;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.net-dot{width:6px;height:6px;border-radius:50%;background:#2ec278;animation:pulse-g 2s infinite}
@keyframes pulse-g{0%,100%{opacity:1}50%{opacity:.4}}


/* ========== CHAT AREA ========== */
.chat-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.msgs{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:#eef1ee;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(10,92,54,.04) 0,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(212,160,23,.04) 0,transparent 50%);
}
.date-lbl{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 10px}
.date-lbl span{
  background:rgba(255,255,255,.9);color:var(--muted);
  border-radius:10px;padding:5px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.07);font-weight:600;
}
.mrow{display:flex;align-items:flex-end;gap:7px;margin-bottom:2px;animation:fu .25s ease-out both;max-width:100%}
.mrow.user{flex-direction:row-reverse}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mav{
  width:30px;height:30px;border-radius:10px;
  background:var(--grad-card);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:2px;
  box-shadow:0 2px 8px rgba(10,92,54,.3);
}
.mav svg{width:18px;height:18px}
.mrow.user .mav{display:none}
.bub{
  max-width:min(82%,calc(100vw - 80px));
  padding:9px 12px 6px;font-size:14.5px;line-height:1.46;
  border-radius:10px;word-wrap:break-word;overflow-wrap:anywhere;
}
.bub.bot{
  background:var(--white);color:var(--onyx);
  border-radius:2px 10px 10px 10px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.05);
}
.bub.user{
  background:linear-gradient(135deg,#1a7a48,#0a5c36);color:#fff;
  border-radius:10px 2px 10px 10px;
  box-shadow:0 2px 8px rgba(10,92,54,.25);
}
.bub .t{font-size:10px;opacity:.5;display:block;margin-top:4px;text-align:right;line-height:1}

/* Service grid */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;width:100%}
.svc-tile{
  background:var(--white);border:1px solid rgba(0,0,0,.06);border-radius:14px;
  padding:10px 4px 9px;min-height:68px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;font-size:10px;font-weight:700;color:var(--charcoal);
  text-align:center;transition:all .15s;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  -webkit-user-select:none;user-select:none;
}
.svc-tile:active{transform:scale(.94);background:var(--light)}
.svc-icon{font-size:22px;line-height:1;margin-bottom:1px}
.svc-label{font-size:9.5px;line-height:1.2;color:var(--slate)}

/* Category header in grid */
.svc-cat-hdr{
  grid-column:1/-1;font-family:var(--fd);font-size:11px;font-weight:700;
  color:var(--savanna-deep);text-transform:uppercase;letter-spacing:.8px;
  margin-top:4px;padding-bottom:4px;border-bottom:2px solid rgba(34,160,90,.15);
}

/* Legacy qa-grid for compatibility */
.qa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;width:100%}
.qa-tile{
  background:var(--white);border:1px solid rgba(0,0,0,.06);border-radius:12px;
  padding:12px 8px;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;font-size:12px;font-weight:600;color:var(--charcoal);
  text-align:center;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.05);
  -webkit-user-select:none;user-select:none;
}
.qa-tile:active{transform:scale(.96);background:var(--light)}
.qa-icon{font-size:22px;line-height:1}

/* Receipt card */
.rcard{
  background:var(--white);border:1px solid rgba(0,0,0,.07);
  border-radius:14px;padding:14px;margin-top:6px;max-width:100%;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}
.rcard-title{
  font-size:11px;font-weight:800;text-transform:uppercase;
  color:var(--savanna-deep);margin-bottom:10px;
  display:flex;align-items:center;gap:5px;letter-spacing:.5px;
}
.rcard-row{
  display:flex;justify-content:space-between;gap:8px;
  font-size:12.5px;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.07);
}
.rcard-row:last-child{border-bottom:none}
.rcard-row :last-child{font-weight:700;text-align:right;flex-shrink:0}
.btn-block{
  width:100%;padding:12px;border-radius:12px;border:none;
  background:var(--grad-card);color:#fff;font-weight:700;font-size:13px;
  margin-top:8px;cursor:pointer;min-height:44px;
  box-shadow:0 3px 12px rgba(10,92,54,.3);transition:all .15s;
}
.btn-block:active{opacity:.9;transform:scale(.99)}
.btn-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn-sub{
  flex:1 1 calc(50% - 6px);min-width:calc(50% - 6px);
  padding:10px;border-radius:12px;border:1px solid rgba(10,92,54,.15);
  background:rgba(34,160,90,.06);color:var(--savanna-deep);font-weight:700;font-size:12px;
  cursor:pointer;min-height:44px;transition:all .15s;
}
.btn-sub:active{background:rgba(34,160,90,.12)}

/* Typing indicator */
.trow{display:none;align-items:flex-end;gap:7px;padding:4px 0}
.trow.show{display:flex}
.tbub{
  background:var(--white);border:1px solid rgba(0,0,0,.06);
  border-radius:2px 10px 10px 10px;padding:11px 16px;
  display:flex;gap:5px;align-items:center;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
}
.td{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:td 1s infinite alternate}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{from{transform:translateY(0);opacity:.3}to{transform:translateY(-5px);opacity:1}}

/* Chips */
.chips-bar{
  flex:0 0 auto;padding:8px 10px;
  display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;background:var(--white);
  border-top:1px solid rgba(0,0,0,.06);scrollbar-width:none;
}
.chips-bar::-webkit-scrollbar{display:none}
.chips-bar:empty{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:20px;
  font-size:12.5px;font-weight:600;cursor:pointer;
  border:1.5px solid rgba(10,92,54,.2);
  background:#fff;color:var(--savanna-deep);
  white-space:nowrap;min-height:34px;
  box-shadow:0 1px 4px rgba(10,92,54,.08);transition:all .15s;
}
.chip:active{background:rgba(34,160,90,.08);transform:scale(.97)}

/* Input bar */
.ibar{
  flex:0 0 auto;background:var(--white);
  padding:8px 10px calc(8px + var(--sab));
  border-top:1px solid rgba(0,0,0,.07);z-index:20;
}
.irow{display:flex;align-items:flex-end;gap:7px}
.ibox{
  flex:1;min-width:0;background:var(--light);border-radius:20px;
  border:1.5px solid rgba(0,0,0,.08);
  display:flex;align-items:flex-end;padding:6px 8px 6px 14px;gap:4px;
  transition:border-color .15s;
}
.ibox:focus-within{border-color:var(--emerald)}
textarea{
  flex:1;border:none;outline:none;background:transparent;
  font-family:var(--fb);font-size:15px;color:var(--onyx);
  resize:none;min-height:26px;max-height:120px;line-height:1.4;
  padding:5px 0;width:100%;
}
textarea::placeholder{color:var(--silver)}
.send{
  width:44px;height:44px;min-width:44px;border-radius:14px;border:none;
  background:var(--grad-card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:17px;flex-shrink:0;
  box-shadow:0 3px 12px rgba(10,92,54,.35);transition:all .15s;
}
.send:active{transform:scale(.95)}
.mic-btn{
  width:34px;height:34px;min-width:34px;border-radius:10px;border:none;
  background:rgba(10,92,54,.1);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-bottom:3px;transition:background .15s;
}
.mic-btn:active{background:rgba(10,92,54,.18)}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--emerald);display:block}
.mic-btn.recording .rec-dot{background:#dc2626;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.8}100%{transform:scale(1);opacity:1}}
.mic-btn.recording{background:#dc2626;animation:pulse-rec 1s infinite}
@keyframes pulse-rec{0%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}50%{box-shadow:0 0 0 7px rgba(220,38,38,.2)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
  padding:max(12px,var(--sal)) max(12px,var(--sar)) max(12px,var(--sab));
}
.modal.show{display:flex}
@media(min-width:520px){.modal{align-items:center}}
.modal-content{
  background:var(--white);border-radius:20px 20px 0 0;
  padding:22px;width:100%;max-width:var(--app-max);
  max-height:min(90dvh,560px);overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.25);
  animation:fu .2s ease-out;
}
@media(min-width:520px){.modal-content{border-radius:20px;max-width:380px}}

/* PIN grid */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pin-btn{
  padding:15px;border-radius:14px;border:1.5px solid rgba(0,0,0,.08);
  background:var(--light);color:var(--onyx);font-weight:800;
  cursor:pointer;text-align:center;min-height:52px;font-size:20px;
  font-family:var(--fd);transition:all .1s;
}
.pin-btn:active{background:rgba(10,92,54,.12);transform:scale(.95)}

.pin-dots{display:flex;justify-content:center;gap:16px;margin:12px 0;padding:12px;background:var(--light);border-radius:12px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--emerald);background:transparent;display:inline-block;transition:background .15s}
.pin-dot.filled{background:var(--emerald)}

/* Shimmer */
.shimmer{background:linear-gradient(90deg,var(--light) 25%,rgba(34,160,90,.08) 50%,var(--light) 75%);background-size:200% 100%;animation:loading 1.5s infinite}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Success animation overlay */
.success-overlay{
  position:absolute;inset:0;background:rgba(10,92,54,.92);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;z-index:200;
  animation:fadeInOut 2.8s ease-in-out forwards;
}
.success-overlay.show{display:flex}
@keyframes fadeInOut{
  0%{opacity:0;transform:scale(.9)}10%{opacity:1;transform:scale(1)}
  75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}
}
.success-ring{
  width:90px;height:90px;border-radius:50%;
  background:rgba(255,255,255,.15);border:3px solid rgba(245,200,66,.8);
  display:flex;align-items:center;justify-content:center;font-size:40px;
  animation:popIn .4s .3s ease-out both;
}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-family:var(--fd);font-size:20px;font-weight:800;color:#fff;text-align:center}
.success-ref{font-size:12px;color:rgba(255,255,255,.6);text-align:center}

/* Network detection badge in chat */
.net-detect{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;
  background:rgba(34,160,90,.1);color:var(--savanna-deep);
  border:1px solid rgba(34,160,90,.2);margin:2px 0;
}

/* Lang toggle */
.lang-toggle{
  display:flex;gap:4px;background:rgba(255,255,255,.12);
  border-radius:10px;padding:3px;
}
.lang-opt{
  padding:3px 8px;border-radius:7px;font-size:11px;font-weight:700;
  cursor:pointer;color:rgba(255,255,255,.6);transition:all .15s;
}
.lang-opt.active{background:rgba(255,255,255,.2);color:#fff}

/* Responsive */
input,textarea,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.qa-tile,.btn-block,.btn-sub,.chip,.hdr-back,.send,.mic-btn,.pin-btn,.svc-tile{touch-action:manipulation}
@media(max-width:519px){
  :root{--hdr-h:72px}
  .hdr{padding:var(--sat) 12px 12px}
  .logo-name{font-size:17px}
  .ibar{padding:10px 10px calc(10px + var(--sab))}
  .ibox{padding:8px 8px 8px 16px;border-radius:22px}
  textarea{min-height:30px;padding:7px 0}
  .send{width:46px;height:46px;border-radius:14px;font-size:18px}
}
@media(max-width:380px){
  .svc-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .svc-tile{min-height:60px;padding:8px 2px 7px}
  .svc-icon{font-size:19px}
  .bub{font-size:14px}
}
@media(max-width:320px){
  .svc-grid{grid-template-columns:repeat(3,1fr)}
  .btn-sub{flex:1 1 100%}
  .chip{font-size:11.5px;padding:6px 11px}
}
@media(orientation:landscape) and (max-height:500px){
  :root{--hdr-h:48px}
  .hdr{padding-bottom:4px}
}
@supports(height:100dvh){.app{height:100dvh}}
</style>
</head>
<body>
<div class="app" id="appShell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-back" id="btnBack" role="button" aria-label="Back" tabindex="0"></div>
    <div class="logo">
      <div>
        <div class="logo-name">SemaTel</div>
        <div class="logo-sub" id="lblSubtitle">SEMA•PATA•MALIZA</div>
      </div>
    </div>
    <div class="hdr-actions">
      
    </div>
  </header>



  <!-- CHAT -->
  <div class="chat-wrap">
    <div class="msgs" id="chatBox" role="log" aria-live="polite">
      <div class="date-lbl"><span id="lblToday">Leo</span></div>
      <div class="trow" id="typingIndicator">
        <div class="mav">
          <svg viewBox="0 0 18 18" fill="none"><path d="M9 2L7 9H3l5 4-2 7 6-5 6 5-2-7 5-4h-4Z" fill="#f5c842"/></svg>
        </div>
        <div class="tbub"><div class="td"></div><div class="td"></div><div class="td"></div></div>
      </div>
    </div>
  </div>

  <!-- CHIPS -->
  <div class="chips-bar" id="chipContainer" role="toolbar" aria-label="Quick replies"></div>

  <!-- INPUT BAR -->
  <footer class="ibar">
    <div class="irow">
      <div class="ibox">
        <textarea id="userInput" rows="1" enterkeyhint="send" placeholder="Andika hapa / Type message..."></textarea>
        <button type="button" class="mic-btn" id="micBtn" title="Voice input" aria-label="Voice input"><span class="rec-dot"></span></button>
      </div>
      <button type="button" class="send" id="btnSend" aria-label="Send">➤</button>
    </div>
  </footer>
</div>

<!-- MODALS -->
<div class="modal" id="securityModal">
  <div class="modal-content" id="securityModalContent"></div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="successOverlay">

/* ========== HELPERS ========== */
function detectNetwork(msisdn){
  if(!msisdn)return null;
  const digits=msisdn.replace(/\D/g,'');
  const local=digits.startsWith('255')?'0'+digits.slice(3):digits;
  return NETWORK_PREFIXES[local.slice(0,4)]||NETWORK_PREFIXES[local.slice(0,3)]||null;
}
function networkWallet(net){return NETWORK_WALLET[net]||net||'M-Pesa'}
function normalizeAmount(text){
  const t=(text||'').toLowerCase().trim();
  const keys=Object.keys(STREET_AMOUNTS).sort((a,b)=>b.length-a.length);
  for(const k of keys){if(t.includes(k))return STREET_AMOUNTS[k];}
  const m=t.match(/(\d[\d,.]*)\s*(k|ksh|tsh|elfu)?/i);
  if(m){let amt=parseInt(m[1].replace(/[,.]/g,''));const sfx=(m[2]||'').toLowerCase();if((sfx==='k'||sfx==='elfu')&&amt<100)amt*=1000;return amt;}
  return null;
}
function extractMeter(text){const m=(text||'').replace(/\D/g,'');return(m.length>=11&&m.length<=13)?m:null}
function extractPhone(text){const m=text.match(/(\+?255\s?7\d{2}\s?\d{3}\s?\d{3}|\+?2557\d{8}|0\d{9}|07\d{8})/g);return m?m[0].replace(/\s+/g,''):null}

/* NLP */
const ManenoIntentIndex=(function(){
  const list=[];
  Object.keys(MANENO_LEXICON).forEach(intent=>{MANENO_LEXICON[intent].forEach(phrase=>{const p=(phrase||'').toLowerCase().trim();if(p)list.push({intent,phrase:p});});});
  list.sort((a,b)=>b.phrase.length-a.phrase.length);
  const esc=s=>s.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&');
  return{match(text){const n=(text||'').toLowerCase().trim();if(!n)return null;for(const item of list){const re=new RegExp('\\b'+esc(item.phrase)+'\\b','i');if(re.test(n)||(item.phrase.includes(' ')&&n.includes(item.phrase)))return item;}return null;}};
})();

function parseIntent(text){
  const t=(text||'').toLowerCase().trim();
  const result={intent:null,confidence:0,amount:null,phone:null,meter:null,product:null,provider:null};
  const streetKeys=Object.keys(STREET_PRODUCTS).sort((a,b)=>b.length-a.length);
  for(const k of streetKeys){if(t.includes(k)){const sp=STREET_PRODUCTS[k];result.intent=sp.intent;result.confidence=.99;if(sp.amount)result.amount=sp.amount;if(sp.product)result.product=sp.product;break;}}
  if(!result.intent){const hit=ManenoIntentIndex.match(t);if(hit){result.intent=hit.intent;result.confidence=.98;}}
  const provMap={'m-pesa':'M-Pesa','mpesa':'M-Pesa','vodacom':'Vodacom','tigo pesa':'Tigo Pesa','tigo':'Tigo','airtel money':'Airtel Money','airtel':'Airtel','halopesa':'HaloPesa','halo pesa':'HaloPesa'};
  Object.keys(provMap).sort((a,b)=>b.length-a.length).forEach(k=>{if(new RegExp('\\b'+k.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&')+'\\b','i').test(t))result.provider=provMap[k];});
  const gbM=t.match(/(\d+(?:\.\d+)?)\s*gb/i);const mbM=t.match(/(\d+(?:\.\d+)?)\s*mb/i);
  if(gbM){result.product=gbM[1]+'GB';if(!result.intent){result.intent='BUY_DATA';result.confidence=.97;}}
  if(mbM){result.product=mbM[1]+'MB';if(!result.intent){result.intent='BUY_DATA';result.confidence=.97;}}
  result.amount=normalizeAmount(t);result.phone=extractPhone(text);
  const meterRe=/\b(\d{11,13})\b/g;let mm;
  while((mm=meterRe.exec(text))!==null){const c=mm[1];if(c!==(result.phone||'').replace(/\D/g,'')){result.meter=c;if(!result.intent){result.intent='BUY_LUKU';result.confidence=.95;}}}
  return result;
}

const TransactionEngine={
  applyBalanceChanges(txData){
    const cost=txData.amount||txData.price||0;
    const type=(txData.type||'').toUpperCase();
    if(type==='AIRTIME'){ChatbotMemory.walletBalance-=cost;ChatbotMemory.airtimeBalance+=cost;}
    else if(['DATA','MONEY','SMS','MINUTES','LUKU','BILLS','GOVT','SCHOOL','PAYBILL','BULK','INTL'].includes(type)){ChatbotMemory.walletBalance-=cost;}
    else if(type==='VOUCHER'){if(txData.voucherType==='DATA'){const cur=parseFloat(String(ChatbotMemory.dataBalance))||0;ChatbotMemory.dataBalance=(cur+1).toFixed(1)+' GB';}else{ChatbotMemory.airtimeBalance+=cost;}}
    ChatbotMemory.recentTransactions.unshift({type:txData.type,details:txData.details||type+' Transaction',amt:cost,date:new Date().toISOString().split('T')[0]});
    StorageManager.save();Engine.updateHeroBalance();
  },
  process(txData){
    return new Promise((resolve,reject)=>{
      if(!navigator.onLine){OfflineTxQueue.enqueue(txData);reject({status:'FAILED',reason:'Offline – muamala umesalia kwa usawazishaji',queued:true});return;}
      setTimeout(()=>{
        const cost=txData.amount||txData.price||0;
        if(ChatbotMemory.walletBalance<cost){reject({status:'FAILED',reason:'Insufficient funds'});return;}
        if(Math.random()>.12){
          this.applyBalanceChanges(txData);FraudGuard.record();
          resolve({status:'SUCCESS',ref:'ST'+Math.floor(10000000+Math.random()*89999999),date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
        }else{
          const reasons=['Insufficient Funds','Network Timeout','API Offline','Gateway declined'];
          reject({status:'FAILED',reason:reasons[Math.floor(Math.random()*reasons.length)]});
        }
      },2000);
    });
  }
};

    if(back){back.addEventListener('click',()=>this.resetToHome());back.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();this.resetToHome();}});}
    if(send)send.addEventListener('click',()=>this.sendMessage());
    if(input){input.addEventListener('keydown',e=>{if(e.key==='Enter'||e.keyCode===13){e.preventDefault();this.sendMessage();}});input.addEventListener('input',function(){LayoutManager.autoResizeTextarea(this);});}
    if(mic)mic.addEventListener('click',()=>this.toggleMic());
    if(chat){chat.addEventListener('click',e=>{const tile=e.target.closest('[data-intent]');if(tile&&tile.dataset.intent)this.processIntent(tile.dataset.intent,{});});}
  },

  tx(k,v){if(v!==undefined&&v!==null)currentTx[k]=v;},
  translate(k){return LANGUAGES[ChatbotMemory.lang][k]||k;},

  showTyping(on){
    const t=document.getElementById('typingIndicator');
    if(!t)return;
    t.classList.toggle('show',on);
    if(on)LayoutManager.scrollChatToEnd();
  },

  addMessage(text,sender,elementHTML){
    const box=document.getElementById('chatBox');if(!box)return;
    const row=document.createElement('div');row.className=`mrow ${sender}`;
    if(sender==='bot'){
      const av=document.createElement('div');av.className='mav';
      av.innerHTML='<svg viewBox="0 0 18 18" fill="none"><path d="M9 2L7 9H3l5 4-2 7 6-5 6 5-2-7 5-4h-4Z" fill="#f5c842"/></svg>';
      row.appendChild(av);
    }
    const bub=document.createElement('div');bub.className=`bub ${sender}`;
    if(elementHTML)bub.innerHTML=elementHTML;else bub.innerText=text;
    const ts=document.createElement('span');ts.className='t';ts.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});bub.appendChild(ts);
    row.appendChild(bub);
    const typing=document.getElementById('typingIndicator');
    if(typing&&typing.parentNode===box)box.insertBefore(row,typing);else box.appendChild(row);
    LayoutManager.scrollChatToEnd();
  },

  setChips(arr){
    const c=document.getElementById('chipContainer');if(!c)return;c.innerHTML='';
    (arr||[]).forEach(label=>{const btn=document.createElement('button');btn.type='button';btn.className='chip';btn.textContent=label;btn.onclick=()=>{this.addMessage(label,'user');this.handleText(label);};c.appendChild(btn);});
  },

  sendMessage(){
    const el=document.getElementById('userInput');const val=el.value.trim();if(!val)return;
    el.value='';LayoutManager.autoResizeTextarea(el);this.addMessage(val,'user');this.handleText(val);
  },

  handleText(text){
    const t=(text||'').trim();
    if(/^(mwanzo|home|start|restart)$/i.test(t)){this.resetToHome();return;}
    if(/^(jaribu tena|retry)$/i.test(t)){this.retryTransaction();return;}
    if(awaitingSlot==='amount'){this.fillAmountSlot(t);return;}
    if(awaitingSlot==='phone'){this.fillPhoneSlot(t);return;}
    if(awaitingSlot==='meter'){this.fillMeterSlot(t);return;}
    if(awaitingSlot==='voucher_code'){this.fillVoucherCodeSlot(t);return;}
    if(awaitingSlot==='voucher_type'){this.fillVoucherTypeSlot(t);return;}
    if(awaitingSlot==='bundle_choice'){this.fillBundleChoiceSlot(t);return;}
    if(awaitingSlot==='more_help'){this.fillMoreHelpSlot(t);return;}
    if(awaitingSlot==='bill_provider'){this.fillBillProviderSlot(t);return;}
    if(awaitingSlot==='bill_account'){this.fillBillAccountSlot(t);return;}
    if(awaitingSlot==='intl_country'){this.fillIntlCountrySlot(t);return;}
    if(awaitingSlot==='school_ref'){this.fillSchoolRefSlot(t);return;}
    if(awaitingSlot==='paybill_number'){this.fillPaybillNumberSlot(t);return;}
    if(awaitingSlot==='bulk_confirm'){this.fillBulkSlot(t);return;}
    if(awaitingSlot==='govt_code'){this.fillGovtSlot(t);return;}

    const parsed=parseIntent(t);
    const chipIntent=CHIP_INTENT_MAP[t];
    const intent=chipIntent||parsed.intent;
    if(!intent||intent==='UNKNOWN'){
      this.showTyping(true);
      setTimeout(()=>{this.showTyping(false);this.addMessage(this.translate('clarify'),'bot');this.setChips(ChatbotMemory.lang==='sw'?['Nunua Airtime','Data','Tuma Pesa','Angalia Salio','LUKU','Bili','Serikali','Karo','Msaada']:['Buy Airtime','Buy Data','Send Money','Check Balance','LUKU','Bills','Government','School Fees','Help']);},400);
      return;
    }
    if(parsed.amount)this.tx('amount',parsed.amount);if(parsed.phone)this.tx('phone',parsed.phone);
    if(parsed.meter)this.tx('meter',parsed.meter);if(parsed.product)this.tx('product',parsed.product);
    if(parsed.provider)this.tx('provider',parsed.provider);
    this.processIntent(intent,parsed);
  },

  processIntent(intent,entities){
    entities=entities||{};
    if(entities.amount)this.tx('amount',entities.amount);if(entities.phone)this.tx('phone',entities.phone);
    if(entities.meter)this.tx('meter',entities.meter);if(entities.product)this.tx('product',entities.product);
    if(entities.provider)this.tx('provider',entities.provider);
    this.setChips([]);
    switch(intent){
      case'BUY_AIRTIME':return this.flowAirtime();
      case'BUY_DATA':case'BUY_DATA_BUNDLE':return this.flowData();
      case'BUY_SMS':return this.flowSMS();
      case'BUY_MINUTES':case'BUY_MINUTE_BUNDLES':return this.flowMinutes();
      case'SEND_MONEY':return this.flowMoney();
      case'CHECK_BALANCE':return this.flowBalance();
      case'REDEEM_VOUCHER':return this.flowVoucher();
      case'MY_ACCOUNT':return this.showAccount();
      case'BUY_LUKU':return this.flowLuku();
      case'PAY_BILLS':return this.flowBills();
      case'INTL_TRANSFER':return this.flowIntlTransfer();
      case'GOVT_PAYMENT':return this.flowGovt();
      case'SCHOOL_FEES':return this.flowSchoolFees();
      case'PAYBILL':return this.flowPaybill();
      case'BULK_PAYMENT':return this.flowBulk();
      case'TRAVEL_BOOKING':return this.flowTravel();
      case'MOBILE_BANKING':return this.flowMobileBanking();
      case'GET_HELP':return this.showHelp();
      default:this.resetToHome();
    }
  },

  /* ---- AIRTIME ---- */
  flowAirtime(){
    currentTx.type='AIRTIME';
    this.showTyping(true);
    setTimeout(()=>{
      this.showTyping(false);
      if(!currentTx.amount){
        awaitingSlot='amount';
        const html=`<div style="font-weight:700;margin-bottom:10px;font-family:var(--fd)">📱 ${ChatbotMemory.lang==='sw'?'Kiasi cha Airtime:':'Airtime Amount:'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
            ${[500,1000,2000,5000,10000,20000].map(a=>`<button class="btn-sub" onclick="Engine.pickAmt(${a})">Tsh ${a.toLocaleString()}</button>`).join('')}
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px">${ChatbotMemory.lang==='sw'?'Au andika kiasi 👇':'Or type any amount 👇'}</div>`;
        this.addMessage(null,'bot',html);return;
      }
      this.proceedToPayment('AIRTIME');
    },400);
  },
  pickAmt(amt){this.addMessage('Tsh '+amt.toLocaleString(),'user');currentTx.amount=amt;this.proceedToPayment(currentTx.type||'AIRTIME');},
  fillAmountSlot(t){const amt=normalizeAmount(t)||parseInt(t.replace(/\D/g,''),10);if(amt>0){awaitingSlot=null;currentTx.amount=amt;this.proceedToPayment(currentTx.type||'AIRTIME');}else this.addMessage(this.translate('ask_missing_amount'),'bot');},

  /* ---- DATA ---- */
  flowData(){
    currentTx.type='DATA';this.showTyping(true);
    setTimeout(()=>{
      this.showTyping(false);
      const bundle=this.resolveDataBundle();
      if(bundle){currentTx.price=bundle.price;currentTx.details=`Data: ${bundle.name} (${bundle.validity})`;this.proceedToPayment('DATA');return;}
      awaitingSlot='bundle_choice';
      const allB=[...DATA_CATALOGUE.Daily,...DATA_CATALOGUE.Weekly,...DATA_CATALOGUE.Monthly];
      let html=`<div style="font-weight:700;margin-bottom:10px;font-family:var(--fd)">📶 ${ChatbotMemory.lang==='sw'?'Chagua Kifurushi:':'Choose Bundle:'}</div>
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Daily</div>`;
      DATA_CATALOGUE.Daily.forEach((b,i)=>{html+=`<button class="btn-block" onclick="Engine.pickBundle(${i})" style="text-align:left;display:flex;justify-content:space-between"><span>${b.name} · ${b.validity}</span><span>Tsh ${b.price.toLocaleString()}</span></button>`;});
      html+=`<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 6px">Weekly</div>`;
      DATA_CATALOGUE.Weekly.forEach((b,i)=>{html+=`<button class="btn-block" onclick="Engine.pickBundle(${DATA_CATALOGUE.Daily.length+i})" style="text-align:left;display:flex;justify-content:space-between"><span>${b.name} · ${b.validity}</span><span>Tsh ${b.price.toLocaleString()}</span></button>`;});
      html+=`<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:8px 0 6px">Monthly</div>`;
      DATA_CATALOGUE.Monthly.forEach((b,i)=>{html+=`<button class="btn-block" onclick="Engine.pickBundle(${DATA_CATALOGUE.Daily.length+DATA_CATALOGUE.Weekly.length+i})" style="text-align:left;display:flex;justify-content:space-between"><span>${b.name} · ${b.validity}</span><span>Tsh ${b.price.toLocaleString()}</span></button>`;});
      this._dataBundleList=allB;this.addMessage(null,'bot',html);
    },400);
  },
  resolveDataBundle(){
    const all=[...DATA_CATALOGUE.Daily,...DATA_CATALOGUE.Weekly,...DATA_CATALOGUE.Monthly];
    if(currentTx.product){const gb=parseFloat(currentTx.product);if(gb){const f=all.find(b=>b.gb===gb||b.name.toLowerCase().includes(currentTx.product.toLowerCase()));if(f)return f;}}
    if(currentTx.amount){const f=all.find(b=>b.price===currentTx.amount);if(f)return f;}
    return null;
  },
  pickBundle(idx){awaitingSlot=null;const b=this._dataBundleList[idx];this.addMessage(b.name+' – Tsh '+b.price.toLocaleString(),'user');currentTx.price=b.price;currentTx.amount=b.price;currentTx.details=`Data: ${b.name} (${b.validity})`;this.proceedToPayment('DATA');},
  fillBundleChoiceSlot(t){const p=parseIntent(t);if(p.product||p.amount){awaitingSlot=null;if(p.product)currentTx.product=p.product;if(p.amount)currentTx.amount=p.amount;this.flowData();}else this.addMessage(this.translate('ask_bundle_choice'),'bot');},

  /* ---- SMS ---- */
  flowSMS(){
    currentTx.type='SMS';this.showTyping(true);
    setTimeout(()=>{
      this.showTyping(false);
      if(currentTx.amount){const match=SMS_CATALOGUE.find(s=>s.price===currentTx.amount)||SMS_CATALOGUE.reduce((b,s)=>Math.abs(s.price-currentTx.amount)<Math.abs(b.price-currentTx.amount)?s:b);currentTx.details=`${match.name} SMS`;currentTx.amount=match.price;this.proceedToPayment('SMS');return;}
      awaitingSlot='bundle_choice';this._smsMode=true;
      let html=`<div style="font-weight:700;margin-bottom:10px;font-family:var(--fd)">💬 SMS Bundle:</div>`;
      SMS_CATALOGUE.forEach((s,i)=>{html+=`<button class="btn-block" onclick="Engine.pickSMS(${i})">${s.name} – Tsh ${s.price.toLocaleString()}</button>`;});
      this.addMessage(null,'bot',html);
    },400);
  },
  pickSMS(idx){awaitingSlot=null;this._smsMode=false;const s=SMS_CATALOGUE[idx];this.addMessage(s.name+' – Tsh '+s.price.toLocaleString(),'user');currentTx.amount=s.price;currentTx.details=`${s.name} SMS`;this.proceedToPayment('SMS');},

  flowMinutes(){
    currentTx.type='MINUTES';this.showTyping(true);

      this.showTyping(false);
      if(currentTx.amount){const match=MINUTE_CATALOGUE.reduce((b,m)=>Math.abs(m.price-currentTx.amount)<Math.abs(b.price-currentTx.amount)?m:b);currentTx.details=`${match.name}`;currentTx.amount=match.price;this.proceedToPayment('MINUTES');return;}
      awaitingSlot='bundle_choice';this._minuteMode=true;

  pickMinute(idx){awaitingSlot=null;this._minuteMode=false;const m=MINUTE_CATALOGUE[idx];this.addMessage(m.name+' – Tsh '+m.price.toLocaleString(),'user');currentTx.amount=m.price;currentTx.details=`${m.name}`;this.proceedToPayment('MINUTES');},

  /* ---- MONEY ---- */
  flowMoney(){
    currentTx.type='MONEY';this.showTyping(true);
    setTimeout(()=>{
      this.showTyping(false);
      if(currentTx.phone){const net=detectNetwork(currentTx.phone);if(net&&!currentTx.provider){currentTx.provider=net;currentTx.wallet=networkWallet(net);}}
      if(!currentTx.phone){awaitingSlot='phone';
        // Show frequent contacts
        let html=`<div style="font-weight:700;margin-bottom:8px;font-family:var(--fd)">💸 ${ChatbotMemory.lang==='sw'?'Mpokeaji:':'Recipient:'}</div>`;
        if(ChatbotMemory.frequentContacts&&ChatbotMemory.frequentContacts.length){
          html+=`<div style="font-size:10.5px;color:var(--muted);margin-bottom:6px">${ChatbotMemory.lang==='sw'?'Mawasiliano ya kawaida:':'Frequent contacts:'}</div>`;
          ChatbotMemory.frequentContacts.forEach((c,i)=>{const color=NETWORK_COLOR[c.provider]||'#555';html+=`<button class="btn-block" style="text-align:left;display:flex;align-items:center;gap:8px" onclick="Engine.pickContact(${i})"><span style="width:32px;height:32px;border-radius:10px;background:${color}20;color:${color};display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0">${c.name[0]}</span><span><div style="font-weight:700">${c.name}</div><div style="font-size:11px;opacity:.6">${c.phone} · ${c.provider}</div></span></button>`;});
        }
        html+=`<div style="font-size:11px;color:var(--muted);margin-top:8px">${ChatbotMemory.lang==='sw'?'Au andika namba 👇':'Or type number 👇'}</div>`;
        this.addMessage(null,'bot',html);return;
      }
      if(!currentTx.amount){awaitingSlot='amount';this.addMessage(this.translate('ask_missing_amount'),'bot');return;}
      this.showMoneySummaryAndPIN();

  },
  pickContact(idx){
    const c=ChatbotMemory.frequentContacts[idx];
    this.addMessage(c.name+' ('+c.phone+')','user');
    currentTx.phone=c.phone;currentTx.provider=c.provider;currentTx.wallet=networkWallet(c.provider);
    awaitingSlot=null;
    if(!currentTx.amount){awaitingSlot='amount';this.addMessage(this.translate('ask_missing_amount'),'bot');return;}
    this.showMoneySummaryAndPIN();
  },
  fillPhoneSlot(t){
    const phone=extractPhone(t)||(t.replace(/\D/g,'').length>=9?t.replace(/\s/g,''):null);
    if(phone){awaitingSlot=null;currentTx.phone=phone;const net=detectNetwork(phone);if(net){currentTx.provider=net;currentTx.wallet=networkWallet(net);this.addMessage(`<span class="net-detect">📡 ${net} / ${networkWallet(net)} ${this.translate('network_detected')}</span>`,'bot');}
      if(!currentTx.amount){awaitingSlot='amount';this.addMessage(this.translate('ask_missing_amount'),'bot');return;}
      this.showMoneySummaryAndPIN();
    }else this.addMessage(this.translate('ask_missing_phone'),'bot');
  },
  showMoneySummaryAndPIN(){
    const isSw=ChatbotMemory.lang==='sw';

      <div class="rcard-row"><span>${isSw?'Kiasi':'Amount'}</span><span style="font-weight:800;color:var(--savanna-deep);font-size:16px">Tsh ${Number(currentTx.amount).toLocaleString()}</span></div>

      <div class="rcard-row"><span>${isSw?'Huduma':'Service'}</span><span>${type}</span></div>
      <div class="rcard-row"><span>${isSw?'Kiasi':'Amount'}</span><span style="font-weight:800;color:var(--savanna-deep);font-size:16px">Tsh ${amt.toLocaleString()}</span></div>
      <div class="rcard-row"><span>${isSw?'Salio Baada':'Balance After'}</span><span>Tsh ${balAfter.toLocaleString()}</span></div>
    </div>`;
    this.addMessage(null,'bot',html);setTimeout(()=>this.showInlinePIN(type),300);
  },

  retryTransaction(){this.showInlinePIN(currentTx.type||'TX');},

  askMoreHelp(){
    setTimeout(()=>{
      this.addMessage(this.translate('more_help'),'bot');
      awaitingSlot='more_help';
      this.setChips(ChatbotMemory.lang==='sw'?['NDIYO','HAPANA, ASANTE']:['YES','NO, THANK YOU']);
    },800);
  },
  fillMoreHelpSlot(t){
    awaitingSlot=null;
    if(/^(ndiyo|yes|ndio)\b/i.test(t)||t.toLowerCase()==='yes'){this.setChips([]);resetTx();this.addMessage(ChatbotMemory.lang==='sw'?'Unaweza kuandika au kuchagua huduma:':'Type or choose a service:','bot');this.renderServiceGrid();}
    else if(/hapana|no|asante|thank/i.test(t)){this.endChat();}
    else{this.handleText(t);}
  },
  endChat(){
    this.setChips([]);
    const html=`<div class="rcard"><div style="font-weight:700;font-size:14px">${this.translate('goodbye')}</div><button class="btn-block" style="margin-top:10px" onclick="Engine.resetToHome()">${ChatbotMemory.lang==='sw'?'Anza Tena':'Start Again'}</button></div>`;
    this.addMessage(null,'bot',html);
  },

  renderServiceGrid(){
    const isSw=ChatbotMemory.lang==='sw';
    const html=`<div class="svc-grid">
      <div class="svc-cat-hdr">${isSw?'Mawasiliano':'Telecom'}</div>
      <div class="svc-tile" data-intent="BUY_AIRTIME"><div class="svc-icon">📱</div><div class="svc-label">Airtime</div></div>
      <div class="svc-tile" data-intent="BUY_DATA"><div class="svc-icon">📶</div><div class="svc-label">Data</div></div>
      <div class="svc-tile" data-intent="BUY_SMS"><div class="svc-icon">💬</div><div class="svc-label">SMS</div></div>
      <div class="svc-tile" data-intent="BUY_MINUTES"><div class="svc-icon">📞</div><div class="svc-label">Dakika</div></div>
      <div class="svc-cat-hdr">${isSw?'Fedha':'Money'}</div>
      <div class="svc-tile" data-intent="SEND_MONEY"><div class="svc-icon">💸</div><div class="svc-label">${isSw?'Tuma Pesa':'Send Money'}</div></div>
      <div class="svc-tile" data-intent="CHECK_BALANCE"><div class="svc-icon">💰</div><div class="svc-label">Salio</div></div>
      <div class="svc-tile" data-intent="INTL_TRANSFER"><div class="svc-icon">🌍</div><div class="svc-label">${isSw?'Tuma Nje':'Intl Xfer'}</div></div>
      <div class="svc-tile" data-intent="BULK_PAYMENT"><div class="svc-icon">👥</div><div class="svc-label">Bulk</div></div>
      <div class="svc-cat-hdr">${isSw?'Bili & Huduma':'Bills & Services'}</div>
      <div class="svc-tile" data-intent="PAY_BILLS"><div class="svc-icon">🧾</div><div class="svc-label">Bili</div></div>
      <div class="svc-tile" data-intent="BUY_LUKU"><div class="svc-icon">⚡</div><div class="svc-label">LUKU</div></div>
      <div class="svc-tile" data-intent="PAYBILL"><div class="svc-icon">🔢</div><div class="svc-label">Paybill</div></div>
      <div class="svc-tile" data-intent="SCHOOL_FEES"><div class="svc-icon">🎓</div><div class="svc-label">Karo</div></div>
      <div class="svc-cat-hdr">${isSw?'Zaidi':'More'}</div>
      <div class="svc-tile" data-intent="GOVT_PAYMENT"><div class="svc-icon">🏛️</div><div class="svc-label">Serikali</div></div>
      <div class="svc-tile" data-intent="TRAVEL_BOOKING"><div class="svc-icon">✈️</div><div class="svc-label">Safari</div></div>
      <div class="svc-tile" data-intent="MOBILE_BANKING"><div class="svc-icon">🏦</div><div class="svc-label">Benki</div></div>
      <div class="svc-tile" data-intent="REDEEM_VOUCHER"><div class="svc-icon">🎫</div><div class="svc-label">Vocha</div></div>
    </div>`;
    this.addMessage(null,'bot',html);
  },

  resetToHome(){resetTx();this.renderWelcome();},

  renderWelcome(){
    const box=document.getElementById('chatBox');
    if(box){const d=box.querySelector('.date-lbl');const ty=document.getElementById('typingIndicator');box.innerHTML='';if(d)box.appendChild(d);if(ty)box.appendChild(ty);}
    this.setChips([]);this.showTyping(true);
    setTimeout(()=>{
      this.showTyping(false);
      const isSw=ChatbotMemory.lang==='sw';
      const welcomeMsg=isSw?'Karibu SemaTel 👋\nHuduma yako ya fedha na simu Tanzania.\nChagua huduma au andika unachotaka.':'Welcome to SemaTel 👋\nTanzania\'s premium financial super-app.\nChoose a service or type what you need.';
      this.addMessage(welcomeMsg,'bot');
      this.renderServiceGrid();
    },400);
  },

  /* ---- VOICE ---- */
  initSpeech(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){const b=document.getElementById('micBtn');if(b)b.style.display='none';return;}
    this.recognition=new SR();
    this.recognition.continuous=false;this.recognition.interimResults=false;
    this.recognition.lang=ChatbotMemory.lang==='en'?'en-TZ':'sw-TZ';
    this._pendingVoice=false;
    this.recognition.onstart=()=>{this.isListening=true;document.getElementById('micBtn').classList.add('recording');document.getElementById('userInput').placeholder='🎙️ Listening...';};
    this.recognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){document.getElementById('userInput').value=t;this._pendingVoice=true;}};
    this.recognition.onerror=()=>{this.addMessage('🎙️ Sikio halijasomeka. Jaribu tena.','bot');};
    this.recognition.onend=()=>{this.isListening=false;document.getElementById('micBtn').classList.remove('recording');document.getElementById('userInput').placeholder='Andika hapa / Type message...';if(this._pendingVoice){this._pendingVoice=false;this.sendMessage();}};
  },
  toggleMic(){if(!this.recognition){this.addMessage('🎙️ Voice input not supported.','bot');return;}this.isListening?this.recognition.stop():this.recognition.start();}
};

/* ========== LAYOUT MANAGER ========== */
const LayoutManager={
  app:null,chatBox:null,
  init(){
    this.app=document.getElementById('appShell');this.chatBox=document.getElementById('chatBox');
    this.updateViewport();
    window.addEventListener('resize',()=>this.updateViewport());
    window.addEventListener('orientationchange',()=>setTimeout(()=>this.updateViewport(),150));
    if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>this.updateViewport());window.visualViewport.addEventListener('scroll',()=>this.updateViewport());}
    const input=document.getElementById('userInput');if(input)this.autoResizeTextarea(input);
  },
  updateViewport(){
    if(!this.app)return;
    const vv=window.visualViewport;const mob=window.matchMedia('(max-width:520px),(pointer:coarse)').matches;
    if(vv&&mob){this.app.style.height=Math.round(vv.height)+'px';this.app.style.marginTop=Math.round(vv.offsetTop)+'px';}
    else{this.app.style.height='';this.app.style.marginTop='';}
    this.scrollChatToEnd();
  },
  autoResizeTextarea(el){if(!el)return;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';this.scrollChatToEnd();},
  scrollChatToEnd(){if(!this.chatBox)return;requestAnimationFrame(()=>{this.chatBox.scrollTop=this.chatBox.scrollHeight;});}
};

window.Engine=Engine;window.LayoutManager=LayoutManager;

function bootSemaTel(){
  if(bootSemaTel.done)return;bootSemaTel.done=true;
  try{Engine.init();}
  catch(err){console.error('SemaTel init failed:',err);const box=document.getElementById('chatBox');if(box)box.insertAdjacentHTML('beforeend','<div class="mrow"><div class="bub bot">Hitilafu. Pakia upya ukurasa.</div></div>');}
}
bootSemaTel.done=false;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootSemaTel);
else bootSemaTel();
</script>
