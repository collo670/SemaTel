<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"/>
<script>
/* Capture the install prompt the instant it fires — must run before the
   rest of the page parses, since Chromium can dispatch it on repeat
   visits before DOMContentLoaded. */
window.__installPromptEvent=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  window.__installPromptEvent=e;
});
/* Apply saved theme before first paint (no light-mode flash) */
try{
  var __s=JSON.parse(localStorage.getItem('sematel_v5')||'{}');
  var __p=__s.theme||'auto';
  var __d=__p==='dark'||(__p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',__d?'dark':'light');
  if(__s.dataSaver)document.documentElement.setAttribute('data-saver','on');
}catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SemaTel"/>
<meta name="theme-color" content="#0B4D33"/>
<meta name="description" content="SemaTel — AI ya huduma za simu na fedha Tanzania. Sema unachotaka, tumia PIN moja, maliza."/>
<link rel="icon" type="image/png" sizes="32x32" href="./logo/sematel.png">
<link rel="icon" type="image/png" sizes="192x192" href="./logo/Android/sematel-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./logo/Android/sematel-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./logo/sematel.png">
<link rel="apple-touch-icon" href="./logo/sematel.png">
<meta name="msapplication-TileImage" content="logo/sematel.png">
<meta name="msapplication-TileColor" content="#0B4D33">
<script>
/* Data-saver mode: skip the webfont request entirely (falls back to the
   system sans-serif already declared in --fd/--fb) instead of just hiding it after load. */
try{
  if(!(JSON.parse(localStorage.getItem('sematel_v5')||'{}').dataSaver)){
    document.write('<link rel="preconnect" href="https://fonts.googleapis.com">');
    document.write('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
    document.write('<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">');
  }
}catch(e){}
</script>
<link rel="manifest" href="./manifest.json">
<title>SemaTel — AI ya Huduma za Simu</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- SPLASH -->
  <div class="splash" id="splash">
    <div class="sp-logo-wrap">
      <span class="sp-ring"></span>
      <span class="sp-ring"></span>
      <span class="sp-ring"></span>
      <img class="sp-logo" src="./logo/sematel.png" alt="SemaTel">
    </div>
    <div class="sp-name">Sema<em>Tel</em></div>
    <div class="sp-tag" id="splashTag">Sema. Pata. Maliza.</div>
  </div>

  <!-- LOCK SCREEN (auto-lock on backgrounding) -->
  <div class="splash lock-veil" id="lockVeil" role="dialog" aria-label="Locked">
    <div class="sp-logo-wrap">
      <span class="sp-ring"></span><span class="sp-ring"></span><span class="sp-ring"></span>
      <img class="sp-logo" src="./logo/sematel.png" alt="SemaTel">
    </div>
    <div class="lock-title" id="lockTitle">Imefungwa kwa Usalama</div>
    <div class="lock-sub" id="lockSub">Weka PIN yako kufungua</div>
    <div class="lock-pin-wrap" id="lockPinWrap"></div>
  </div>

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-row">
      <div class="hdr-logo">S</div>
      <div>
        <div class="hdr-name">Sema<em>Tel</em></div>
        <div class="hdr-status"><span class="dot" id="statusDot"></span><span id="statusTxt">Sema.Pata.Maliza</span></div>
      </div>
      <div class="hdr-spacer"></div>
      <button class="hdr-btn" id="langBtn" title="Language" aria-label="Change language">🌐</button>
      <button class="hdr-btn" id="menuBtn" title="Menu" aria-label="Open menu">☰</button>
    </div>
  </header>

  <div class="net-banner" id="netBanner">⚠️ Hakuna intaneti — miamala itasubiri usawazishaji</div>

  <!-- CHAT -->
  <main class="chat" id="chat" aria-live="polite"></main>

  <!-- QUICK CHIPS -->
  <nav class="chips" id="chips" aria-label="Quick replies"></nav>

  <!-- COMPOSER -->
  <footer class="composer">
    <div class="voice-hint" id="voiceHint">
      <span class="wv"><i></i><i></i><i></i><i></i></span>
      <span id="voiceHintTxt">Nasikiliza… sema sasa</span>
    </div>
    <button class="c-btn c-plus" id="plusBtn" aria-label="All services">＋</button>
    <div class="c-input-wrap">
      <textarea id="userInput" rows="1" placeholder="Andika au sema unachotaka…" aria-label="Message"></textarea>
      <button class="c-mic" id="micBtn" aria-label="Voice input">🎙️</button>
    </div>
    <button class="c-btn c-send" id="sendBtn" aria-label="Send">➤</button>
  </footer>

  <!-- SHEETS -->
  <div class="sheet-veil" id="veil"></div>
  <div class="sheet" id="svcSheet" role="dialog" aria-label="All services">
    <div class="sheet-grab"></div>
    <div class="sheet-title" id="svcSheetTitle">Huduma Zote</div>
    <div class="svc-grid" id="svcGrid"></div>
  </div>
  <div class="sheet" id="menuSheet" role="dialog" aria-label="Menu">
    <div class="sheet-grab"></div>
    <div class="sheet-title" id="menuSheetTitle">Menyu</div>
    <button class="bal-pill" id="balPill" aria-label="Balances">
      <span>💰</span>
      <span>
        <span class="lbl" id="balLbl">Wallet</span><br>
        <span class="amt" id="balWallet">Tsh 50,000</span>
      </span>
      <span class="sub" id="balMini">📱 Tsh 3,200 · 📶 1.5 GB</span>
      <span class="eye" id="balEye">👁️</span>
    </button>
    <div id="menuList"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
